<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Verifiche · prof. Becattini</title>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap');

        h1, h2, h3 { font-family: 'Fraunces', serif; letter-spacing: -0.01em; }

        body {
            font-family: 'Schibsted Grotesk', sans-serif;
            letter-spacing: -0.01em;
            background-color: #eef0ea;
            color: #262420;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #e3e5dd; }
        ::-webkit-scrollbar-thumb { background: #b9a6d9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #57534a; }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .bounce-in { animation: bounceIn 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
        @keyframes bounceIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .pulse-red { animation: pulseRed 1.6s ease-in-out infinite; }
        /* PALLINO ROSSO (19/09/2026): l'alunno ha abbassato o lasciato la pagina della prova.
           22/09/2026, come in Cedolino Facile: PICCOLO e ROSSO FISSO, niente lampeggio. */
        .dot-fuori { display:inline-block; width:8px; height:8px; border-radius:50%; background:#e0261f; margin-left:8px; vertical-align:middle; }
        /* Durante la prova il testo delle domande non si seleziona e non si copia (le caselle di risposta restano scrivibili) */
        body.in-prova, body.in-prova *:not(textarea):not(input) { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
        body.in-prova textarea, body.in-prova input { -webkit-user-select:text; user-select:text; }
        @keyframes pulseRed { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }
        .scale-hover { transition: transform .15s ease; }
        .scale-hover:hover { transform: scale(1.02); }

        /* ====== STAMPA / EXPORT PDF ====== */
        #print-area { display: none; }
        @media print {
            @page { size: A4; margin: 16mm 14mm; }
            body { background: #ffffff !important; }
            .no-print { display: none !important; }
            #root { display: none !important; }
            #print-area { display: block !important; }
            .print-student { page-break-after: always; }
            .print-student:last-child { page-break-after: auto; }
            .print-q { page-break-inside: avoid; }
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ab: {
                            blue: '#57534a',
                            red: '#b4472f',
                            lightblue: '#aec8ce',
                            green: '#5c8b73',

<body class="min-h-screen flex flex-col bg-[#eef0ea]">

    <div id="root" class="flex-grow flex flex-col relative"></div>
    <div id="print-area"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        /* =====================================================================
           CONFIGURAZIONE URL E CHIAVI SUPABASE
        ===================================================================== */
        const SUPABASE_URL = "https://zwuutlrafdmfqexbnohc.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_6oCmDuDh_8ibf-p4ZAcfZg_muXXuO8N"; 

        // Il riconoscimento del docente sta nella memoria DELLA SCHEDA (sessionStorage): resiste a un F5, ma chiusa la
        // scheda non c'e' piu' e alla prossima apertura la password si ridigita, come in Cedolino Facile.
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { storage: window.sessionStorage, storageKey: 'ver-docente-auth', persistSession: true, autoRefreshToken: true }
        });
        const DOCENTE_KEY = 'ver_docente_attivo';

        // «Becattini Mauro» e' l'alunno dimostrativo del docente: negli elenchi sta sempre in cima.
        const eProf = (s) => { const n = s ? ((s.lastName || '') + ' ' + (s.firstName || '')) : ''; return /\bbecattini\b/i.test(n) && /\bmauro\b/i.test(n); };
        const profInCima = (a, b) => (eProf(b) ? 1 : 0) - (eProf(a) ? 1 : 0);

        /* =====================================================================
           SCRITTURE A PEZZETTI (19/09/2026) — mai piu' «riscrivo tutto»
           Prima ogni modifica rispediva al cloud l'INTERA scheda di tutte le classi, partendo da una copia vecchia
           fino a 3 secondi: con venti alunni che scrivono insieme, ognuno cancellava le ultime lettere degli altri.
           Ora si manda solo cio' che e' cambiato (percorso + valore) e il server lo applica in fila, un pezzetto
           alla volta, sulla riga bloccata (porta ver_applica). Due alunni non possono piu' pestarsi i piedi, e il
           docente che tocca lo stato di un alunno non tocca le sue risposte.
        ===================================================================== */
        const ugualiJson = (a, b) => JSON.stringify(a) === JSON.stringify(b);

        // Che cosa e' cambiato fra due fotografie di «classes»: classe intera, campo della classe, alunno intero,
        // oppure SINGOLO CAMPO dell'alunno (answers, status, openGrades...). E' questa finezza che salva il lavoro.
        const diffClassi = (base, next) => {
            const ops = []; base = base || {}; next = next || {};
            Object.keys(base).forEach(c => { if (!(c in next)) ops.push({ p: ['classes', c], del: true }); });
            Object.keys(next).forEach(c => {
                const B = base[c], N = next[c];
                if (!B || typeof B !== 'object') { ops.push({ p: ['classes', c], v: N }); return; }
                Object.keys(B).forEach(k => { if (k !== 'students' && !(k in N)) ops.push({ p: ['classes', c, k], del: true }); });
                Object.keys(N).forEach(k => { if (k !== 'students' && !ugualiJson(B[k], N[k])) ops.push({ p: ['classes', c, k], v: N[k] }); });
                const BS = B.students, NS = N.students || {};
                if (!BS || typeof BS !== 'object') { ops.push({ p: ['classes', c, 'students'], v: NS }); return; }
                Object.keys(BS).forEach(pn => { if (!(pn in NS)) ops.push({ p: ['classes', c, 'students', pn], del: true }); });
                Object.keys(NS).forEach(pn => {
                    const b = BS[pn], n = NS[pn];
                    if (!b || typeof b !== 'object') { ops.push({ p: ['classes', c, 'students', pn], v: n }); return; }
                    Object.keys(b).forEach(f => { if (!(f in n)) ops.push({ p: ['classes', c, 'students', pn, f], del: true }); });
                    Object.keys(n).forEach(f => { if (!ugualiJson(b[f], n[f])) ops.push({ p: ['classes', c, 'students', pn, f], v: (n[f] === undefined ? null : n[f]) }); });
                });
            });
            return ops;
        };

        // Applica i pezzetti a una fotografia di «classes», con la STESSA regola del server: si crea solo l'ultima
        // chiave del percorso; se la classe o l'alunno non esistono piu', il pezzetto cade nel vuoto.
        const applicaOps = (classes, ops) => {
            let root = { classes: classes || {} };
            (ops || []).forEach(op => {
                const path = op.p || [];
                if (path[0] !== 'classes') return;
                if (path.length === 1) { if (!op.del) root = { classes: op.v || {} }; return; }
                const nuovo = { ...root }; let src = root, dst = nuovo;
                for (let i = 0; i < path.length - 1; i++) {
                    const k = path[i], figlio = src[k];
                    if (!figlio || typeof figlio !== 'object' || Array.isArray(figlio)) return;   // percorso interrotto
                    dst[k] = { ...figlio }; src = figlio; dst = dst[k];
                }
                const ultima = path[path.length - 1];
                if (op.del) delete dst[ultima]; else dst[ultima] = op.v;
                root = nuovo;
            });
            return root.classes;
        };
        const chiaveOp = (op) => JSON.stringify(op.p);

        /* LE PORTE DELL'ALUNNO (19/09/2026). L'alunno non legge e non scrive piu' la scheda di tutti (app_state):
           parla col cloud solo attraverso funzioni che gli danno la SUA scheda e le domande SENZA le risposte giuste
           (ver_entra, ver_mio, ver_battito, ver_rispondi, ver_consegna, ver_riprova, ver_esci). Si chiamano sempre
           con la chiave pubblica, mai con il riconoscimento del docente, e con keepalive quando la pagina sta morendo
           (un telefono congela la pagina subito dopo averla mandata dietro: una richiesta normale morirebbe li'). */
        /* TEMPO MASSIMO (20/09/2026, come in Cedolino Facile e Fattura Facile). Con la rete debole una richiesta puo'
           restare APPESA: non fallisce e non risponde, e chi aspettava la risposta (l'ingresso, il salvataggio di una
           risposta, la consegna) restava fermo per sempre, perche' i ritentativi scattano solo davanti a un errore.
           Dopo 25 secondi la richiesta appesa viene troncata e diventa un errore come gli altri. */
        const TEMPO_MASSIMO_RICHIESTA_MS = 25000;
        const porta = async (nome, corpo, subito) => {
            const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
            const sveglia = ac ? setTimeout(() => { try { ac.abort(); } catch (e) {} }, TEMPO_MASSIMO_RICHIESTA_MS) : null;
            try {
                const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + nome, {
                    method: 'POST', keepalive: !!subito,
                    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
                    body: JSON.stringify(corpo || {}),
                    signal: ac ? ac.signal : undefined
                });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return await r.json();
            } finally { if (sveglia) clearTimeout(sveglia); }
        };
        // Come sopra, ma con pazienza: se la rete ha un buco riprova (un buco di rete non e' un PIN sbagliato).
        const portaPaziente = async (nome, corpo, tentativi = 3) => {
            let ultimoErrore = null;
            for (let i = 0; i < tentativi; i++) {
                try { return await porta(nome, corpo); } catch (e) { ultimoErrore = e; await new Promise(ok => setTimeout(ok, 1200 * (i + 1))); }
            }
            throw ultimoErrore;
        };
        // Il codice di questo dispositivo: serve a riconoscere «lo stesso telefono di prima» (rientro entro mezz'ora).
        let dispositivoInMemoria = null;
        const codiceDispositivo = () => {
            try {
                let d = localStorage.getItem('ver_dispositivo');
                if (!d) { d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('d' + Date.now() + Math.random().toString(16).slice(2)); localStorage.setItem('ver_dispositivo', d); }
                return d;
            } catch (e) {
                if (!dispositivoInMemoria) dispositivoInMemoria = 'm' + Date.now() + Math.random().toString(16).slice(2);
                return dispositivoInMemoria;
            }
        };
        let ultimoSeq = 0;
        const prossimoSeq = () => { ultimoSeq = Math.max(Date.now(), ultimoSeq + 1); return ultimoSeq; };   // sempre crescente

        const SESSION_KEY = "ab_exam_session_v1"; 
        const SOGLIA_SUFFICIENZA = 60;            

        /* =====================================================================
           UTILS PER IL GOVERNO DELLE RISPOSTE E DEI PUNTEGGI
        ===================================================================== */
        const shuffle = (arr) => {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };

        const buildOptionOrder = (questions) => {
            const order = {};
            questions.forEach(q => {
                if (q.type === 'single' || q.type === 'multi') order[q.id] = shuffle(q.options.map((_, i) => i));
            });
            return order;
        };

        // Per gli abbinamenti: ordine (per-studente) sia delle voci a sinistra sia delle opzioni a destra
        const buildMatchOrder = (questions) => {
            const mo = {};
            questions.filter(q => q.type === 'matching').forEach(q => {
                const idxs = (q.pairs || []).map((_, i) => i);
                mo[q.id] = { items: shuffle(idxs), opts: shuffle(idxs) };
            });
            return mo;
        };

        // Ordine casuale delle domande, salvato per studente (così due vicini hanno sequenze diverse)
        const buildQuestionOrder = (questions) => shuffle(questions.map(q => q.id));

        const isClosed = (q) => q.type !== 'open';

        // Punteggio di una domanda: parametrico per tipo; le aperte usano il voto del docente
        const pointsForQuestion = (q, student) => {
            if (q.type === 'open') {
                const g = student.openGrades && student.openGrades[q.id];
                return (g && g.score != null) ? g.score : 0;
            }
            const a = student.answers && student.answers[q.id];
            if (!a || a.selection == null) return 0;
            const sel = a.selection;
            if (q.type === 'single') {
                return sel === q.correctIndex ? q.points : 0;
            }
            if (q.type === 'multi') {
                if (!Array.isArray(sel)) return 0;
                const correct = sel.filter(i => (q.correctIndices || []).includes(i)).length;
                const wrong = sel.length - correct;
                if (wrong === 0 && correct === 2) return q.points;   // entrambe giuste
                if (correct >= 1) return 0.4;                        // almeno una giusta (basta indovinarne una, anche con una sbagliata)
                return 0;
            }
            if (q.type === 'matching') {
                const pairs = q.pairs || [];
                const total = pairs.length || 4;
                let ok = 0;
                pairs.forEach(p => { if (sel && sel[p.item] === p.match) ok++; });
                if (ok === total) return q.points;                  // tutte le coppie
                if (ok >= 2) return 0.5;                             // 2 o 3 coppie
                return 0;
            }
            return 0;
        };

        // Somma dei soli quesiti chiusi (compatibile con i punti dei vecchi richiami)
        const computeClosedScore = (student, questions) =>
            questions.filter(isClosed).reduce((t, q) => t + pointsForQuestion(q, student), 0);

        // Tre conteggi separati: chiuse, aperte, totale (+ percentuale). Rileva solo cosa esiste.
        const computeBreakdown = (student, questions) => {
            let closedScore = 0, closedMax = 0, openScore = 0, openMax = 0;
            questions.forEach(q => {
                const pts = pointsForQuestion(q, student);
                if (q.type === 'open') { openScore += pts; openMax += q.points; }
                else { closedScore += pts; closedMax += q.points; }
            });
            const total = closedScore + openScore;
            const totalMax = closedMax + openMax;
            return { closedScore, closedMax, openScore, openMax, total, totalMax, percent: totalMax ? (total / totalMax * 100) : 0 };
        };

        // Tutte le domande aperte sono state valutate dal docente?
        const allOpenGraded = (student, questions) => {
            const opens = questions.filter(q => q.type === 'open');
            if (opens.length === 0) return true;
            return opens.every(q => student.openGrades && student.openGrades[q.id] && student.openGrades[q.id].score != null);
        };

        // Numero di quesiti aperti
        const countOpen = (questions) => questions.filter(q => q.type === 'open').length;

        // Le domande nell'ordine (casuale) salvato per lo studente; con fallback robusto
        const orderedQuestions = (student, questions) => {
            const ord = student && student.questionOrder;
            if (Array.isArray(ord) && ord.length) {
                const byId = {}; questions.forEach(q => { byId[q.id] = q; });
                const list = ord.map(id => byId[id]).filter(Boolean);
                questions.forEach(q => { if (!ord.includes(q.id)) list.push(q); });
                return list;
            }
            return questions;
        };

        // Una domanda risulta "risposta"?
        const isAnswered = (q, student) => {
            if (q.type === 'open') {
                const a = student.answers && student.answers[q.id];
                return !!(a && typeof a.selection === 'string' && a.selection.trim().length > 0);
            }
            const a = student.answers && student.answers[q.id];
            if (!a || a.selection == null) return false;
            if (Array.isArray(a.selection)) return a.selection.length > 0;
            if (typeof a.selection === 'object') return Object.keys(a.selection).length > 0;
            return true;
        };

        /* UN COGNOME E UN NOME (22/09/2026, regola di Mauro). In 4F «Rodriguez Figueroa Emely Massiel» (32 caratteri)
           spingeva la tabella del cruscotto oltre il bordo e la colonna delle azioni finiva tagliata. La tabella resta
           com'e' (1152 px, celle e caselle di prima): e' il nome che si accorcia. Nel cruscotto si mostrano UN cognome e
           UN nome: il primo cognome (con la sua particella: «De Luca», «Di Maria» restano interi) e il primo nome.
           Tetto di sicurezza: NOME_MAX caratteri, misurati sulla tabella vera (con 22 la 3F ci stava per tre pixel);
           oltre, resta il cognome e del nome solo l'iniziale. La regola si applica anche quando si CARICA una classe,
           cosi' nel cloud vale per qualunque classe futura. Il PIN identifica comunque ognuno. */
        const NOME_MAX = 21;
        const PARTICELLE = /^(de|di|del|della|dello|dei|degli|delle|da|dal|dalla|dallo|la|lo|le|van|von|der|den|mc|mac|san|santa|el|al|ben|bin|abu|d'|dell')$/i;
        const primaParola = (testo, conParticella) => {
            const parole = String(testo || '').trim().split(/\s+/).filter(Boolean);
            if (!parole.length) return '';
            let n = 1;
            if (conParticella) while (n < parole.length && PARTICELLE.test(parole[n - 1].replace(/’$/, "'"))) n++;
            return parole.slice(0, n).join(' ');
        };
        const nomeBreve = (cognome, nome) => {
            const c = primaParola(cognome, true), n = primaParola(nome, false);
            if ((c + ' ' + n).trim().length <= NOME_MAX || !n) return (c + ' ' + n).trim();
            return (c + ' ' + n.charAt(0) + '.').trim();
        };

        // Numero "all'italiana" (virgola decimale)
        const fmtN = (n) => parseFloat(Number(n || 0).toFixed(2)).toString().replace('.', ',');

        // Conversione percentuale → voto del registro (3 minimo, 10 massimo)
        const votoFromPercent = (percent) => {
            const p = Math.round(percent);
            if (p <= 30) return "3";
            const tabella = [
                [41, "4"], [43, "4+"], [46, "4,5"], [48, "5-"], [51, "5"], [53, "5+"], [56, "5,5"],
                [58, "6-"], [61, "6"], [63, "6+"], [66, "6,5"], [68, "7-"], [71, "7"], [73, "7+"],
                [76, "7,5"], [78, "8-"], [81, "8"], [83, "8+"], [86, "8,5"], [88, "9-"], [91, "9"],
                [93, "9+"], [96, "9,5"], [98, "10-"], [100, "10"]
            ];
            for (let k = 0; k < tabella.length; k++) { if (p <= tabella[k][0]) return tabella[k][1]; }
            return "10";
        };

        const findStudent = (classes, pin) => {
            for (const cls of Object.keys(classes)) {
                if (classes[cls].students[pin]) {
                    return { cls, student: classes[cls].students[pin] };
                }
            }
            return null;
        };

        // Scaricamento file robusto: la revoca ritardata evita che Firefox annulli il download.
        const downloadFile = (content, filename, mime) => {
            const blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.rel = 'noopener';
            document.body.appendChild(a); a.click();
            setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
        };
        const oggiISO = () => new Date().toISOString().slice(0, 10);

        // Normalizza uno studente ripristinato da backup (compatibilita' con backup vecchi)
        const normalizzaStudente = (s) => ({
            pin: String(s.pin),
            firstName: s.firstName || '', lastName: s.lastName || '',
            status: s.status || 'idle',
            answers: s.answers || {},
            optionOrder: s.optionOrder || {},
            matchOrder: s.matchOrder || {},
            questionOrder: Array.isArray(s.questionOrder) ? s.questionOrder : [],
            openGrades: s.openGrades || {},
            openAnswer: s.openAnswer || '',
            openScore: s.openScore != null ? s.openScore : null,
            openComment: s.openComment || '',
            closedScore: s.closedScore != null ? s.closedScore : null,
            graded: s.graded != null ? s.graded : false,
            startedAt: s.startedAt != null ? s.startedAt : null,
            submittedAt: s.submittedAt != null ? s.submittedAt : null,
            resumeAllowed: s.resumeAllowed != null ? s.resumeAllowed : false
        });

        /* =====================================================================
           ICONE
        ===================================================================== */
        const Icon = ({ name, size = 20, className = "" }) => {
            const p = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", xmlns: "http://www.w3.org/2000/svg" };
            const icons = {
                prev: <svg {...p}><polyline points="15 18 9 12 15 6"/></svg>,
                next: <svg {...p}><polyline points="9 18 15 12 9 6"/></svg>,
                check: <svg {...p}><polyline points="20 6 9 17 4 12"/></svg>,
                x: <svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
                alert: <svg {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
                lock: <svg {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
                unlock: <svg {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>,
                send: <svg {...p}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
                medal: <svg {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>,
                users: <svg {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
                edit: <svg {...p}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
                print: <svg {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
                trash: <svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
                eye: <svg {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
                logout: <svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
                chevron: <svg {...p}><polyline points="6 9 12 15 18 9"/></svg>,
                clock: <svg {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
                shield: <svg {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
                key: <svg {...p}><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>,
                archive: <svg {...p}><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>,
                upload: <svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
                download: <svg {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
                refresh: <svg {...p}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            };
            return <span className={className}>{icons[name]}</span>;
        };

        const Signature = ({ light, title }) => (
            <div className="mt-8 mb-4 text-center opacity-80 select-none no-print">
                <div className={`${light ? 'text-white' : 'text-[#57534a]'} font-bold tracking-widest text-sm`}>{title ? title : 'ARTE BIANCA DI NEIVE'}</div>
            </div>
        );

        const StatusBadge = ({ status }) => {
            const map = {
                idle:      { t: "Non iniziato", c: "bg-gray-100 text-gray-500" },
                playing:   { t: "In corso",     c: "bg-[#aec8ce]/40 text-[#57534a]" },
                offline:   { t: "Non collegato", c: "bg-gray-100 text-gray-500" },
                locked:    { t: "Bloccato",     c: "bg-[#b4472f]/10 text-[#b4472f]" },
                submitted: { t: "Consegnato",   c: "bg-[#ebc871]/30 text-[#7a5c14]" },
                published: { t: "Pubblicato",   c: "bg-[#5c8b73]/15 text-[#3f6a52]" }
            };
            const s = map[status] || map.idle;
            return <span className={`text-xs font-bold px-2.5 py-1 rounded-full whitespace-nowrap ${s.c}`}>{s.t}</span>;
        };

        const Modal = ({ children, onClose, maxW = "max-w-md" }) => (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm fade-in no-print" onClick={onClose}>
                <div className={`w-full ${maxW} bg-white rounded-3xl shadow-lg p-7 bounce-in`} onClick={e => e.stopPropagation()}>
                    {children}
                </div>
            </div>
        );

        /* =====================================================================
           COMPONENTI GRAFICI PER LE DOMANDE
        ===================================================================== */
        const SingleChoice = ({ q, answer, onAnswer, locked, reveal, order }) => {
            const display = (order && order.length === q.options.length) ? order : q.options.map((_, i) => i);
            return (
                <div className="space-y-3">
                    {display.map((origIdx) => {
                        const opt = q.options[origIdx];
                        const isSelected = answer?.selection === origIdx;
                        const isCorrect = origIdx === q.correctIndex;
                        let style = "bg-white border border-gray-200 text-[#262420]";
                        let icon = null;
                        if (reveal) {
                            if (isCorrect) { style = "bg-[#5c8b73] text-white border-[#5c8b73]"; icon = "check"; }
                            else if (isSelected) { style = "bg-[#b4472f] text-white border-[#b4472f]"; icon = "x"; }
                            else { style = "bg-gray-50 text-gray-400 border-transparent opacity-70"; }
                        } else if (isSelected) {
                            style = "bg-[#aec8ce] border-[#57534a] text-[#262420] shadow-md";
                        }
                        const interactive = !locked && !reveal;
                        return (
                            <div key={origIdx} onClick={() => interactive && onAnswer(q.id, origIdx)}
                                className={`p-4 rounded-xl shadow-sm transition-all flex items-center justify-between ${style} ${interactive ? 'cursor-pointer hover:border-[#57534a] hover:shadow-md' : 'cursor-default'}`}>
                                <div className="flex items-center w-full">
                                    <div className={`w-5 h-5 rounded-full border-2 mr-4 flex items-center justify-center flex-shrink-0 ${(isSelected || (reveal && isCorrect)) ? 'border-white/60' : 'border-gray-300'}`}>
                                        {(isSelected || (reveal && isCorrect)) && <div className={`w-2.5 h-2.5 rounded-full ${reveal ? 'bg-white' : 'bg-[#57534a]'}`}></div>}
                                    </div>
                                    <span className="font-medium text-sm md:text-base leading-snug">{opt}</span>
                                </div>
                                {icon && <Icon name={icon} size={20} className="text-white ml-2 flex-shrink-0"/>}
                            </div>
                        );
                    })}
                </div>
            );
        };

        const OpenAnswer = ({ value, onChange, locked, maxLength = 400 }) => {
            // Blocco "incolla" indipendente dal dispositivo: se in un solo inserimento
            // entrano troppi caratteri insieme (tipico dell'incolla), lo rifiutiamo.
            // La digitazione normale e i suggerimenti/correzioni della tastiera (poche
            // lettere o una parola alla volta) restano consentiti.
            const SOGLIA_BLOCCO = 25;
            const handleChange = (e) => {
                const next = e.target.value;
                const prev = value || '';
                if (next.length - prev.length > SOGLIA_BLOCCO) {
                    // inserimento in blocco: non aggiorno lo stato, il testo non entra
                    return;
                }
                onChange(next);
            };
            return (
                <div>
                    <textarea value={value} disabled={locked} maxLength={maxLength}
                        onChange={handleChange}
                        onPaste={e => e.preventDefault()}
                        onDrop={e => e.preventDefault()}
                        onContextMenu={e => e.preventDefault()}
                        autoComplete="off" autoCorrect="off" autoCapitalize="sentences" spellCheck={false}
                        rows={7} placeholder="Scrivi qui la tua risposta argomentata…"
                        className="w-full p-4 rounded-xl border-2 border-gray-200 focus:border-[#57534a] outline-none resize-none text-sm md:text-base leading-relaxed disabled:bg-gray-50" />
                    <div className="text-xs text-[#827f75] mt-2 flex items-center justify-between">
                        <span className="flex items-center gap-1"><Icon name="alert" size={13}/> Incolla e trascinamento disattivati.</span>
                        <span>{(value || '').length} / {maxLength}</span>
                    </div>
                </div>
            );
        };

        const MultiChoice = ({ q, answer, onToggle, order, locked, reveal }) => {
            const sel = (answer && Array.isArray(answer.selection)) ? answer.selection : [];
            const display = (order && order.length === q.options.length) ? order : q.options.map((_, i) => i);
            return (
                <div>
                    {!reveal && <div className="text-xs font-semibold text-[#827f75] mb-2 flex items-center gap-1"><Icon name="alert" size={13}/> Seleziona esattamente 2 opzioni.</div>}
                    <div className="space-y-3">
                    {display.map((origIdx) => {
                        const opt = q.options[origIdx];
                        const picked = sel.includes(origIdx);
                        const isCorrect = (q.correctIndices || []).includes(origIdx);
                        let style = "bg-white border border-gray-200 text-[#262420]";
                        let icon = null;
                        if (reveal) {
                            if (picked && isCorrect) { style = "bg-[#5c8b73] text-white border-[#5c8b73]"; icon = "check"; }
                            else if (picked && !isCorrect) { style = "bg-[#b4472f] text-white border-[#b4472f]"; icon = "x"; }
                            else if (!picked && isCorrect) { style = "bg-[#5c8b73]/10 text-[#3f6b52] border-2 border-[#5c8b73]"; icon = null; }
                            else { style = "bg-gray-50 text-gray-400 border-transparent opacity-70"; }
                        } else if (picked) {
                            style = "bg-[#aec8ce] border-[#57534a] text-[#262420] shadow-md";
                        }
                        const interactive = !locked && !reveal;
                        return (
                            <div key={origIdx} onClick={() => interactive && onToggle(q.id, origIdx)}
                                className={`p-4 rounded-xl shadow-sm transition-all flex items-center justify-between ${style} ${interactive ? 'cursor-pointer hover:border-[#57534a] hover:shadow-md' : 'cursor-default'}`}>
                                <div className="flex items-center w-full">
                                    <div className={`w-5 h-5 rounded-md border-2 mr-4 flex items-center justify-center flex-shrink-0 ${picked ? 'border-white/60' : 'border-gray-300'}`}>
                                        {picked && <div className={`w-2.5 h-2.5 rounded-sm ${reveal ? 'bg-white' : 'bg-[#57534a]'}`}></div>}
                                    </div>
                                    <span className="font-medium text-sm md:text-base leading-snug">{opt}</span>
                                </div>
                                {icon && <Icon name={icon} size={20} className="text-white ml-2 flex-shrink-0"/>}
                            </div>
                        );
                    })}
                    </div>
                </div>
            );
        };

        const Matching = ({ q, answer, onPick, order, locked, reveal }) => {
            const pairs = q.pairs || [];
            const sel = (answer && answer.selection && typeof answer.selection === 'object') ? answer.selection : {};
            const itemsOrder = (order && order.items && order.items.length === pairs.length) ? order.items : pairs.map((_, i) => i);
            const optsOrder = (order && order.opts && order.opts.length === pairs.length) ? order.opts : pairs.map((_, i) => i);
            const matchOptions = Array.isArray(q.opzioni) ? optsOrder.map(i => q.opzioni[i]) : optsOrder.map(i => pairs[i].match);
            return (
                <div className="space-y-3">
                    {itemsOrder.map((i) => {
                        const p = pairs[i];
                        const chosen = sel[p.item] || "";
                        const ok = chosen === p.match;
                        let rowStyle = "border-gray-200";
                        if (reveal) rowStyle = chosen ? (ok ? "border-[#5c8b73] bg-[#5c8b73]/5" : "border-[#b4472f] bg-[#b4472f]/5") : "border-gray-300";
                        return (
                            <div key={p.item} className={`p-3 rounded-xl border ${rowStyle}`}>
                                <div className="font-semibold text-sm text-[#262420] mb-2">{p.item}</div>
                                {!reveal ? (
                                    <select value={chosen} disabled={locked} onChange={(e) => onPick(q.id, p.item, e.target.value)}
                                        className="w-full p-2.5 rounded-lg border-2 border-gray-200 focus:border-[#57534a] outline-none text-sm bg-white">
                                        <option value="">— scegli —</option>
                                        {matchOptions.map((m, k) => <option key={k} value={m}>{m}</option>)}
                                    </select>
                                ) : (
                                    <div className="text-sm">
                                        <div className={ok ? "text-[#3f6a52] font-semibold" : "text-[#b4472f] font-semibold"}>
                                            {chosen || <span className="italic text-gray-400">nessuna scelta</span>} {chosen ? (ok ? "✓" : "✗") : ""}
                                        </div>
                                        {!ok && <div className="text-[#57534a] text-xs mt-1">Corretto: {p.match}</div>}
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        };

        const OpenReview = ({ q, student, reveal }) => {
            const a = student.answers && student.answers[q.id];
            const text = (a && typeof a.selection === 'string') ? a.selection : '';
            const g = student.openGrades && student.openGrades[q.id];
            return (
                <div>
                    <div className="bg-gray-50 rounded-xl p-4 text-sm text-[#262420] whitespace-pre-wrap leading-relaxed">{text || <span className="italic text-gray-400">Nessuna risposta fornita.</span>}</div>
                    {reveal && g && g.comment && (
                        <div className="bg-[#aec8ce]/20 rounded-xl p-4 text-sm mt-3">
                            <div className="text-xs font-bold text-[#57534a] uppercase mb-1">Commento del docente</div>
                            <div className="text-[#262420] leading-relaxed whitespace-pre-wrap">{g.comment}</div>
                        </div>
                    )}
                </div>
            );
        };

        const Landing = ({ onStudent, onAdmin }) => {
            const [pin, setPin] = useState("");
            const [err, setErr] = useState("");
            const [adminPwOpen, setAdminPwOpen] = useState(false);
            const [pw, setPw] = useState("");
            const [pwErr, setPwErr] = useState("");
            const [mail, setMail] = useState(() => { try { return localStorage.getItem('cf_mail_docente') || ''; } catch (e) { return ''; } });
            const [attesa, setAttesa] = useState(false);
            const [entrando, setEntrando] = useState(false);

            const submitPin = () => {
                const clean = pin.trim().toLowerCase();
                if (clean === "admin") { apriDocente(); return; }
                if (!/^\d{5}$/.test(pin.trim())) { setErr("Il PIN deve essere di 5 cifre."); return; }
                if (entrando) return;                       // un doppio tocco su «Entra» non deve fare due ingressi
                setEntrando(true);
                onStudent(pin.trim(), (res) => { setEntrando(false); if (!res.ok) setErr(res.msg); });
            };

            // DOCENTE: si entra con l'utente del cloud (lo stesso di Cedolino Facile). La password non sta nella pagina:
            // la controlla il cloud, e il cloud controlla anche che quell'utente sia nell'elenco dei docenti.
            const apriDocente = () => { setPwErr(""); setPw(""); setAdminPwOpen(true); };
            const submitPw = async () => {
                if (attesa) return;
                if (!mail.trim() || !pw) { setPwErr("Scrivi email e password."); return; }
                setAttesa(true); setPwErr("");
                try {
                    const { error } = await supabase.auth.signInWithPassword({ email: mail.trim(), password: pw });
                    if (error) { setPwErr(/invalid/i.test(error.message || '') ? "Email o password errata." : "Il collegamento non risponde: riprova."); setPw(""); setAttesa(false); return; }
                    const r = await supabase.rpc('cf_e_docente');
                    if (r.data !== true) { await supabase.auth.signOut(); setPwErr("Questo utente non è fra i docenti autorizzati."); setPw(""); setAttesa(false); return; }
                    try { localStorage.setItem('cf_mail_docente', mail.trim()); } catch (e) { }
                    setAttesa(false); setPw(""); setAdminPwOpen(false);
                    onAdmin();
                } catch (e) { setPwErr("Il collegamento non risponde: riprova."); setAttesa(false); }
            };

            return (
                <div className="flex-grow flex flex-col items-center justify-center p-5 fade-in">
                    <div className="w-full max-w-sm bg-white rounded-[2rem] shadow-card border border-gray-100 p-8 text-center">
                        <div className="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-[#57534a] text-white mb-4">
                            <Icon name="key" size={30} />
                        </div>
                        <h1 className="text-2xl font-extrabold text-[#57534a] leading-tight">Accesso alla Verifica</h1>
                        <p className="text-sm text-[#827f75] mt-2 mb-6">Inserisci il PIN personale a 5 cifre.</p>

                        <input inputMode="numeric" maxLength={5} value={pin} onChange={e => { setPin(e.target.value.replace(/[^0-9a-zA-Z]/g, '')); setErr(""); }} onKeyDown={e => e.key === 'Enter' && submitPin()} placeholder="• • • • •"
                            className="w-full text-center text-3xl font-extrabold tracking-[0.4em] py-4 rounded-2xl border-2 border-gray-200 focus:border-[#57534a] outline-none transition-colors text-[#57534a]" />
                        {err && <div className="text-[#b4472f] text-sm font-semibold mt-3">{err}</div>}

                        <button onClick={submitPin} disabled={entrando} className="w-full mt-5 py-4 rounded-2xl font-bold bg-[#57534a] text-white shadow-lg hover:bg-[#454138] transition-colors scale-hover flex items-center justify-center gap-2 disabled:opacity-60">
                            {entrando ? 'Un momento…' : 'Entra'} <Icon name="next" size={18} />
                        </button>
                        <button onClick={apriDocente} className="mt-5 text-xs font-semibold text-gray-400 hover:text-[#57534a] inline-flex items-center gap-1"><Icon name="shield" size={14} /> Accesso docente</button>
                    </div>
                    <Signature />

                    {adminPwOpen && (
                        <Modal onClose={() => { setAdminPwOpen(false); setPw(""); setPwErr(""); }}>
                            <div className="text-center">
                                <h3 className="text-xl font-extrabold text-[#57534a]">Area Docente</h3>
                                <p className="text-sm text-[#827f75] mt-1 mb-5">Email e password del docente.</p>
                                <input type="email" value={mail} autoComplete="username" onChange={e => { setMail(e.target.value); setPwErr(""); }} onKeyDown={e => e.key === 'Enter' && submitPw()} placeholder="Email"
                                    className="w-full text-center text-base font-semibold py-3 rounded-xl border-2 border-gray-200 focus:border-[#57534a] outline-none mb-3" />
                                <input type="password" value={pw} autoFocus autoComplete="current-password" onChange={e => { setPw(e.target.value); setPwErr(""); }} onKeyDown={e => e.key === 'Enter' && submitPw()} placeholder="Password"
                                    className="w-full text-center text-lg font-semibold py-3 rounded-xl border-2 border-gray-200 focus:border-[#57534a] outline-none" />
                                {pwErr && <div className="text-[#b4472f] text-sm font-semibold mt-3">{pwErr}</div>}
                                <div className="grid grid-cols-2 gap-3 mt-5">
                                    <button onClick={() => { setAdminPwOpen(false); setPw(""); setPwErr(""); }} className="py-3 rounded-xl font-bold border-2 border-gray-200 text-[#57534a] hover:bg-gray-50">Annulla</button>
                                    <button onClick={submitPw} disabled={attesa} className="py-3 rounded-xl font-bold bg-[#57534a] text-white hover:bg-[#454138] disabled:opacity-60">{attesa ? 'Un momento…' : 'Accedi'}</button>
                                </div>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        };

        /* =====================================================================
           VISUALIZZAZIONE E REVISIONE DELLA PROVA COMPLETA
        ===================================================================== */
        const ReviewExam = ({ student, cls, reveal, questions, maxClosed, maxOpen, maxTotal }) => {
            const bd = computeBreakdown(student, questions);
            const total = bd.total;
            const percent = bd.totalMax ? Math.round(bd.percent) : 0;
            const passed = percent >= SOGLIA_SUFFICIENZA;
            const ordered = orderedQuestions(student, questions);
            const answeredCount = questions.filter(q => isAnswered(q, student)).length;
            const hasClosed = bd.closedMax > 0;
            const hasOpen = bd.openMax > 0;

            return (
                <div>
                    <div className="flex items-center justify-between mb-4">
                        <div>
                            <div className="text-xs font-bold text-gray-400 uppercase tracking-widest">Classe {cls} · PIN {student.pin}</div>
                            <h3 className="text-xl font-extrabold text-[#57534a]">{student.lastName} {student.firstName}</h3>
                        </div>
                        {reveal ? (
                            <div className="text-center">
                                <div className="text-[10px] uppercase tracking-widest text-[#827f75] mb-0.5">Esito</div>
                                <div className={`text-5xl font-extrabold leading-none tracking-tight ${passed ? 'text-[#5c8b73]' : 'text-[#b4472f]'}`}>{percent}%</div>
                                <div className="mt-1.5 text-[#262420]"><span className="text-sm font-medium">voto </span><span className="text-2xl font-extrabold">{votoFromPercent(bd.percent)}</span></div>
                            </div>
                        ) : (
                            <div className="text-right">
                                <div className="text-2xl font-extrabold text-[#57534a]">{answeredCount}/{questions.length}</div>
                                <div className="text-xs font-semibold text-[#827f75]">risposte date</div>
                            </div>
                        )}
                    </div>

                    {reveal && (
                        <div className="flex flex-wrap gap-2 mb-4 text-xs font-semibold">
                            {hasClosed && <span className="bg-gray-100 rounded-lg px-3 py-1.5 text-[#57534a]">Chiuse {fmtN(bd.closedScore)}/{fmtN(bd.closedMax)}</span>}
                            {hasOpen && <span className="bg-[#b9a6d9]/25 rounded-lg px-3 py-1.5 text-[#5e4e70]">Aperte {fmtN(bd.openScore)}/{fmtN(bd.openMax)}</span>}
                            <span className="bg-[#57534a] text-white rounded-lg px-3 py-1.5">Totale {fmtN(total)}/{fmtN(bd.totalMax)}</span>
                        </div>
                    )}

                    <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                        {ordered.map((q, i) => {
                            const a = student.answers ? student.answers[q.id] : null;
                            const answered = isAnswered(q, student);
                            const pts = pointsForQuestion(q, student);
                            const isOpen = q.type === 'open';
                            let border, badgeClass, badgeText;
                            if (isOpen) {
                                border = "border-[#b9a6d9]"; badgeClass = "bg-[#b9a6d9]/25 text-[#5e4e70]"; badgeText = reveal ? `${fmtN(pts)}/${fmtN(q.points)} pt` : "APERTA";
                            } else if (!reveal) {
                                border = answered ? "border-[#57534a]" : "border-gray-300";
                                badgeClass = answered ? "bg-[#aec8ce]/40 text-[#57534a]" : "bg-gray-200 text-gray-600";
                                badgeText = answered ? "RISPOSTA" : "IN BIANCO";
                            } else if (!answered) {
                                border = "border-gray-300"; badgeClass = "bg-gray-200 text-gray-600"; badgeText = "NON RISPOSTA";
                            } else if (Math.abs(pts - q.points) < 0.01) {
                                border = "border-[#5c8b73]"; badgeClass = "bg-[#5c8b73]/10 text-[#5c8b73]"; badgeText = "CORRETTA";
                            } else if (pts > 0) {
                                border = "border-[#ebc871]"; badgeClass = "bg-[#ebc871]/20 text-[#827f75]"; badgeText = "PARZIALE";

                                                return <span className={`text-xs font-bold px-2 py-1 rounded ${ptsClass}`}>{fmtN(pts)} / {fmtN(q.points)}</span>;

                                    <p className="font-bold text-[#262420] mb-3 leading-relaxed text-sm md:text-base">{q.question}</p>

                                    {q.type === 'multi' && <MultiChoice q={q} answer={a} onToggle={()=>{}} order={student.optionOrder?.[q.id]} locked reveal={reveal} />}
                                    {q.type === 'matching' && <Matching q={q} answer={a} onPick={()=>{}} order={student.matchOrder?.[q.id]} locked reveal={reveal} />}
                                    {q.type === 'open' && <OpenReview q={q} student={student} reveal={reveal} />}
                                    {reveal && !isOpen && q.explanation && (

                                </div>
                            );
                        })}

            );
        };

        const StudentApp = ({ vista, azioni }) => {
            const pin = vista.student.pin;
            const cls = vista.cls;

            const maxClosed = questions.filter(q => q.type === 'single').reduce((a, q) => a + q.points, 0);
            const openQuestion = questions.find(q => q.type === 'open');
            const maxOpen = openQuestion ? openQuestion.points : 0;
            const maxTotal = maxClosed + maxOpen;
            const [idx, setIdx] = useState(0);
            const [confirmOpen, setConfirmOpen] = useState(false);
            const [consegnando, setConsegnando] = useState(false);
            const risposte = student.answers || {};

            /* NIENTE COPIA (19/09/2026). Vale solo a prova IN CORSO: il testo delle domande non si seleziona e non si
               copia. La presenza e il pallino rosso li manda il battito, in App. */
            const inProva = student.status === 'playing';
            useEffect(() => {
                if (!inProva) return;
                const noCopia = (e) => { e.preventDefault(); };
                document.addEventListener('copy', noCopia);
                document.addEventListener('cut', noCopia);
                document.addEventListener('contextmenu', noCopia);
                document.body.classList.add('in-prova');
                return () => {
                    document.removeEventListener('copy', noCopia);
                    document.removeEventListener('cut', noCopia);
                    document.removeEventListener('contextmenu', noCopia);
                    document.body.classList.remove('in-prova');

            }, [inProva]);

            const answer = (qid, selection) => {
                if (student.status !== 'playing') return;
                azioni.rispondi(qid, selection);
            };

            const toggleMulti = (qid, idx) => {
                if (student.status !== 'playing') return;
                const cur = (risposte[qid] && Array.isArray(risposte[qid].selection)) ? risposte[qid].selection : [];
                let next;
                if (cur.includes(idx)) next = cur.filter(x => x !== idx);
                else if (cur.length >= 2) next = [cur[1], idx];   // mantiene al massimo 2 selezioni
                else next = [...cur, idx];
                azioni.rispondi(qid, next);
            };

            const pickMatch = (qid, itemText, matchText) => {
                if (student.status !== 'playing') return;
                const cur = (risposte[qid] && risposte[qid].selection && typeof risposte[qid].selection === 'object') ? risposte[qid].selection : {};
                azioni.rispondi(qid, { ...cur, [itemText]: matchText });

            const setOpen = (qid, text) => {
                if (student.status !== 'playing') return;
                azioni.rispondi(qid, text);
            };

            // In esercitazione la prova va subito pubblicata (lo decide il cloud): lo studente vede voto e correzione.
            const consegna = async () => {
                if (consegnando) return;
                setConsegnando(true);

                setConsegnando(false);

                else alert("Il collegamento non risponde: la consegna non è partita. Riprova fra un momento (le tue risposte sono al sicuro).");
            };

            // ESERCITAZIONE: nuovo tentativo (sovrascrive il precedente). Risposte azzerate e ordini nuovi li fa il cloud.
            const riprova = async () => {
                setIdx(0);
                const ok = await azioni.riprova();
                if (!ok) alert("Il collegamento non risponde: riprova fra un momento.");
            };

            if (student.status === 'locked') {
                return (
                    <div className="flex-grow flex flex-col items-center justify-center p-6 bg-[#b4472f] text-white text-center fade-in min-h-screen">

                        <h1 className="text-3xl font-extrabold mt-6">Accesso bloccato</h1>

                        <div className="mt-6 bg-white/15 rounded-2xl px-5 py-3 font-bold tracking-wide">{student.lastName} {student.firstName}</div>

            if (student.status === 'submitted') {
                return (
                    <div className="flex-grow flex flex-col items-center justify-center p-6 text-center fade-in">

                        <h1 className="text-2xl font-extrabold text-[#57534a] mt-6">Verifica consegnata</h1>

                        <div className="mt-6 bg-gray-100 rounded-2xl px-5 py-3 font-bold text-[#57534a]">{student.lastName} {student.firstName}</div>

            if (student.status === 'published') {

                    <div className="flex-grow flex flex-col items-center p-4 pt-6 fade-in">

                            {esercitazione && (
                                <div className="mt-5">
                                    <button onClick={riprova} className="w-full py-4 rounded-2xl font-bold bg-[#5c8b73] text-white shadow-lg hover:brightness-95 transition scale-hover flex items-center justify-center gap-2"><Icon name="refresh" size={20}/> Riprova · Nuova esercitazione</button>
                                    <p className="text-center text-xs text-[#827f75] mt-2">Il nuovo tentativo sostituisce quello precedente.</p>
                                </div>
                            )}
                            <Signature title={examTitle} />
                        </div>
                    </div>
                );
            }

            if (questions.length === 0) {
                return (
                    <div className="flex-grow flex flex-col items-center justify-center p-6 text-center">
                        <div className="text-xl font-bold text-[#57534a]">Caricamento o nessuna prova attiva...</div>
                    </div>
                );
            }

            const ordered = orderedQuestions(student, questions);
            const q = ordered[idx] || ordered[0];
            const ans = risposte[q.id];
            const answeredCount = questions.filter(cq => isAnswered(cq, student)).length;

            return (
                <div className="flex-grow flex flex-col min-h-screen">
                    <div className="sticky top-0 z-30 bg-[#57534a] text-white shadow-md">
                        <div className="max-w-2xl mx-auto px-4 py-2 flex items-center justify-between gap-2">
                            <div className="leading-none min-w-0">
                                <div className="text-[10px] uppercase tracking-widest text-white/60">Classe {cls}{esercitazione ? ' · Esercitazione' : ''}</div>
                                <div className="text-lg md:text-xl font-extrabold tracking-tight truncate">{student.lastName} {student.firstName}</div>
                            </div>
                            {examTitle && <div className="flex-1 text-center px-1 min-w-0"><div className="text-xs md:text-sm font-semibold text-white/85 truncate">{examTitle}</div></div>}
                            <div className="text-right leading-none flex-shrink-0">
                                <div className="text-[10px] uppercase tracking-widest text-white/60">Risposte</div>
                                <div className="text-lg font-extrabold">{answeredCount}/{questions.length}</div>
                            </div>
                        </div>
                    </div>

                    <div className="flex-grow w-full max-w-2xl mx-auto px-4 py-4 flex flex-col">
                        <div className="flex flex-wrap gap-1.5 justify-center mb-4">
                            {ordered.map((qq, i) => (
                                <button key={qq.id} onClick={() => setIdx(i)}
                                    className={`w-3 h-3 rounded-full transition-all ${i === idx ? 'ring-2 ring-offset-1 ring-[#57534a] scale-125' : ''} ${isAnswered(qq, student) ? (qq.type === 'open' ? 'bg-[#b9a6d9]' : 'bg-[#57534a]') : 'bg-gray-300'}`} />
                            ))}
                        </div>

                        <div className="bg-white rounded-2xl shadow-card border border-gray-100 p-6 flex-grow fade-in" key={q.id}>
                            <div className="flex items-center justify-between mb-3">
                                <span className="text-xs font-bold text-gray-400 uppercase tracking-widest">Domanda {idx+1} di {ordered.length}</span>
                                <span className="text-xs font-bold text-[#57534a] bg-gray-100 px-2 py-1 rounded">{fmtN(q.points)} pt</span>
                            </div>
                            <p className="font-bold text-[#262420] text-lg mb-5 leading-relaxed">{q.question}</p>
                            {q.type === 'single' && <SingleChoice q={q} answer={ans} onAnswer={answer} order={student.optionOrder?.[q.id]} />}
                            {q.type === 'multi' && <MultiChoice q={q} answer={ans} onToggle={toggleMulti} order={student.optionOrder?.[q.id]} />}
                            {q.type === 'matching' && <Matching q={q} answer={ans} onPick={pickMatch} order={student.matchOrder?.[q.id]} />}
                            {q.type === 'open' && <OpenAnswer value={ans && typeof ans.selection === 'string' ? ans.selection : ''} onChange={(t) => setOpen(q.id, t)} maxLength={q.maxLength || 400} />}
                        </div>

                        <div className="grid grid-cols-2 gap-3 mt-4">
                            <button disabled={idx === 0} onClick={() => setIdx(i => Math.max(0, i-1))} className="py-3.5 rounded-xl font-bold border-2 border-[#57534a] text-[#57534a] disabled:opacity-30 disabled:border-gray-200 disabled:text-gray-300 flex items-center justify-center gap-1"><Icon name="prev" size={18}/> Indietro</button>
                            {idx < ordered.length - 1 ? <button onClick={() => setIdx(i => Math.min(ordered.length-1, i+1))} className="py-3.5 rounded-xl font-bold bg-[#57534a] text-white hover:bg-[#454138] flex items-center justify-center gap-1">Avanti <Icon name="next" size={18}/></button> : <button onClick={() => setConfirmOpen(true)} className="py-3.5 rounded-xl font-bold bg-[#5c8b73] text-white hover:brightness-95 flex items-center justify-center gap-2"><Icon name="send" size={18}/> Consegna</button>}
                        </div>
