                    {confirmOpen && (
                        <Modal onClose={() => setConfirmOpen(false)}>
                            <div className="text-center">
                                <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#5c8b73]/15 text-[#5c8b73] mb-3"><Icon name="send" size={26}/></div>
                                <h3 className="text-xl font-extrabold text-[#57534a]">Consegnare la verifica?</h3>
                                <p className="text-sm text-[#827f75] mt-2 mb-1">Hai risposto a <b>{answeredCount}</b> domande su <b>{questions.length}</b>.</p>
                                <p className="text-sm text-[#827f75] mb-5">{esercitazione ? 'Dopo l’invio vedrai subito il tuo esito e la correzione.' : 'Dopo l’invio non potrai più cambiare le risposte.'}</p>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => setConfirmOpen(false)} className="py-3 rounded-xl font-bold border-2 border-[#57534a] text-[#57534a] hover:bg-gray-50">Annulla</button>
                                    <button onClick={consegna} disabled={consegnando} className="py-3 rounded-xl font-bold bg-[#5c8b73] text-white hover:brightness-95 disabled:opacity-60">{consegnando ? 'Invio…' : 'Consegna'}</button>
                                </div>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        };

        /* =====================================================================
           CRUSCOTTO DEL DOCENTE (ADMIN PANEL) E ARCHIVIO
        ===================================================================== */
        const AdminApp = ({ db, onSyncUpdate, onResetDB, onExit }) => {
            const classesList = Object.keys(db.classes || {});
            const [cls, setCls] = useState(classesList[0] || "");
            const [grading, setGrading] = useState(null);   
            const [viewPin, setViewPin] = useState(null);    
            const [reopenPin, setReopenPin] = useState(null);
            const [resetOpen, setResetOpen] = useState(false);
            const [provaNuova, setProvaNuova] = useState(null);   // verifica letta dal file, in attesa del «Sì, procedi» (classe con una verifica gia' svolta)
            const [resetText, setResetText] = useState("");
            const [pubOpen, setPubOpen] = useState(false);
            const [printingCls, setPrintingCls] = useState(null);
            const [forceAllOpen, setForceAllOpen] = useState(false);
            const [undoAllOpen, setUndoAllOpen] = useState(false);

            const classInputRef = useRef(null);
            const testInputRef = useRef(null);
            const backupInputRef = useRef(null);

            useEffect(() => { if (!cls && classesList.length > 0) setCls(classesList[0]); }, [classesList, cls]);

            const classData = db.classes[cls];

            /* PALLINO ROSSO: chi, fra gli alunni con la prova IN CORSO, ha lasciato la pagina. Lettura ogni secondo,
               solo se c'e' qualcuno al lavoro. Nessun blocco e nessun avviso: solo il pallino accanto al nome.
               22/09/2026, la regola di Cedolino Facile (lezione in 5H): il pallino NON dipende dal collegamento. Il
               telefono congela la pagina abbassata, i battiti si fermano e dopo 20 secondi l'alunno non e' piu'
               «collegato»: prima il pallino si spegneva pur essendo lui ancora fuori, e si riaccendeva al primo battito.
               Ora resta acceso su TUTTI quelli con la pagina dietro, insieme, finche' ognuno non torna («sono tornato»)
               o non chiude (ver_esci azzera «fuori»); dopo il rientro resta ancora 3 secondi, come prima.
               22/09/2026 sera, REGOLA DI MAURO del 19/09 ripristinata: su chi e' «Non collegato» il pallino NON c'e'
               («e' ovvio che puo' guardare il mondo»). Lo decide la riga della tabella, con lo stesso `scollegati`. */
            const [rossi, setRossi] = useState({});
            const codaRossiRef = useRef({});   // pin -> ultimo istante in cui era fuori (per i 3 secondi di coda)
            const [scollegati, setScollegati] = useState({});   // prova in corso ma pagina chiusa (o muta da 20 secondi): «Non collegato»
            const pinInCorso = classData ? Object.values(classData.students).filter(s => s.status === 'playing').map(s => String(s.pin)).sort().join(',') : '';
            useEffect(() => {
                if (!pinInCorso) { setRossi({}); setScollegati({}); return; }
                let vivo = true;
                const leggi = async () => {
                    try {
                        const { data, error } = await supabase.rpc('ver_segnali_leggi', { p_pins: pinInCorso.split(',') });
                        if (!vivo || error || !Array.isArray(data)) return;
                        const m = {}, n = {}, adesso = Date.now(), coda = codaRossiRef.current;
                        data.forEach(r => {
                            const pin = String(r.pin);
                            if (r.fuori) coda[pin] = adesso;
                            if (r.fuori || (coda[pin] && adesso - coda[pin] < 3000)) m[pin] = true;
                            if (r.collegato === false) n[pin] = true;
                        });
                        setRossi(m); setScollegati(n);
                    } catch (e) { }
                };
                leggi();
                const t = setInterval(leggi, 1000);
                return () => { vivo = false; clearInterval(t); };
            }, [pinInCorso]);

            const esercitazione = !!(classData && classData.esercitazione);
            const students = classData ? Object.values(classData.students).sort((a,b) => profInCima(a,b) || (a.lastName+a.firstName).localeCompare(b.lastName+b.firstName)) : [];
            const questions = (classData && classData.questions) || [];
            const examTitle = (classData && classData.examTitle) || '';
            const maxClosed = questions.filter(q => q.type === 'single').reduce((a, q) => a + q.points, 0);
            const openQuestion = questions.find(q => q.type === 'open');
            const maxOpen = openQuestion ? openQuestion.points : 0;
            const maxTotal = maxClosed + maxOpen;

            const handleUploadClasse = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        if (!parsed.classe || !parsed.alunni) throw new Error("JSON classe non valido");
                        const newStudents = {};
                        parsed.alunni.forEach(al => {
                            newStudents[al.pin] = {
                                pin: String(al.pin), firstName: primaParola(al.nome, false), lastName: primaParola(al.cognome, true),   // un cognome e un nome (vedi nomeBreve)
                                status: 'idle', answers: {}, openAnswer: '', openScore: null,
                                openComment: '', closedScore: null, graded: false, startedAt: null, submittedAt: null
                            };
                        });
                        const existing = db.classes[parsed.classe];
                        const updatedClasses = { ...db.classes, [parsed.classe]: { published: false, esercitazione: (existing && existing.esercitazione) || false, students: newStudents, questions: (existing && existing.questions) || [], examTitle: (existing && existing.examTitle) || '' } };
                        onSyncUpdate(null, null, null, updatedClasses);
                        setCls(parsed.classe);
                        alert(`Classe ${parsed.classe} caricata correttamente!`);
                    } catch (err) { alert("Errore nel file JSON della classe."); }
                };
                reader.readAsText(file);
                e.target.value = "";
            };

            const handleUploadProva = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!cls || !classData) { alert("Seleziona prima la classe a cui vuoi abbinare questa verifica."); e.target.value = ""; return; }
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        const domande = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.domande) ? parsed.domande : null);
                        if (!domande || domande.length === 0) throw new Error("Nessuna domanda trovata.");
                        const titolo = (!Array.isArray(parsed) && parsed && parsed.titolo) ? String(parsed.titolo) : '';
                        // (21/09/2026, chiesto da Mauro) Se in questa classe qualcuno ha gia' iniziato o consegnato la verifica di
                        // prima, le sue risposte (salvate per numero di domanda) finirebbero corrette contro le domande nuove, e
                        // rientrando col PIN vedrebbe le soluzioni della verifica nuova senza averla fatta. Quindi si chiede
                        // conferma e, col si', si scarica il backup, si rimettono tutti a zero e si abbina la verifica nuova.
                        if (Object.values(classData.students || {}).some(s => s && s.status && s.status !== 'idle')) { setProvaNuova({ domande, titolo }); return; }
                        const updatedClasses = { ...db.classes, [cls]: { ...classData, questions: domande, examTitle: titolo } };
                        onSyncUpdate(null, null, null, updatedClasses);
                        alert(`Verifica abbinata alla classe ${cls} (${domande.length} domande${titolo ? ' · ' + titolo : ''}).`);
                    } catch (err) { alert("Errore nel file JSON dei quesiti."); }
                };
                reader.readAsText(file);
                e.target.value = "";
            };

            // VERIFICA NUOVA su una classe che ne ha gia' svolta una: backup, alunni a zero (stessi PIN), verifica abbinata.
            // Gli alunni si RICREANO da capo, come fa «Carica classe»: mai ritoccare le schede che vengono da db.classes.
            const confermaProvaNuova = () => {
                if (!provaNuova || !cls || !classData) { setProvaNuova(null); return; }
                exportBackup();                // i risultati della verifica di prima non si perdono
                const azzerati = {};
                Object.keys(classData.students || {}).forEach(p => {
                    const s = classData.students[p];
                    azzerati[p] = {
                        pin: String(s.pin), firstName: s.firstName, lastName: s.lastName,
                        status: 'idle', answers: {}, openAnswer: '', openScore: null,
                        openComment: '', closedScore: null, graded: false, startedAt: null, submittedAt: null
                    };
                });
                const updatedClasses = { ...db.classes, [cls]: { ...classData, published: false, students: azzerati, questions: provaNuova.domande, examTitle: provaNuova.titolo } };
                onSyncUpdate(null, null, null, updatedClasses);
                alert(`Verifica abbinata alla classe ${cls} (${provaNuova.domande.length} domande${provaNuova.titolo ? ' · ' + provaNuova.titolo : ''}). Backup scaricato, alunni rimessi a zero.`);
                setProvaNuova(null);
            };

            // ESERCITAZIONE: attiva/disattiva la modalità esercitazione per la classe selezionata.
            const toggleEsercitazione = () => {
                if (!classData) return;
                const updatedClasses = { ...db.classes, [cls]: { ...classData, esercitazione: !esercitazione } };
                onSyncUpdate(null, null, null, updatedClasses);
            };

            const sblocca = (pin) => {
                const cur = classData.students[pin];
                const st = { ...cur, status: 'playing', resumeAllowed: true };
                if (!st.optionOrder || Object.keys(st.optionOrder).length === 0) st.optionOrder = buildOptionOrder(questions);
                if (!st.matchOrder || Object.keys(st.matchOrder).length === 0) st.matchOrder = buildMatchOrder(questions);
                if (!Array.isArray(st.questionOrder) || !st.questionOrder.length) st.questionOrder = buildQuestionOrder(questions);
                if (!st.openGrades) st.openGrades = {};
                if (!st.startedAt) st.startedAt = Date.now();
                onSyncUpdate(cls, pin, st);
            };

            // CONSEGNA FORZATA (singolo studente 'playing'): stesso effetto della consegna volontaria.
            // In esercitazione -> published (voto immediato); in verifica -> submitted (nessun voto automatico).
            const consegnaForzata = (pin) => {
                const cur = classData.students[pin];
                if (!cur || cur.status !== 'playing') return;
                const st = { ...cur };
                st.status = esercitazione ? 'published' : 'submitted';
                st.submittedAt = Date.now();
                st.closedScore = computeClosedScore(st, questions);
                st.forced = true;   // consegna forzata: marchio per poterla annullare
                onSyncUpdate(cls, pin, st);
            };

            // CONSEGNA FORZATA per tutta la classe: chiude in un colpo tutti gli studenti 'playing'.
            const consegnaForzataClasse = () => {
                if (!classData) { setForceAllOpen(false); return; }
                const updatedStudents = { ...classData.students };
                Object.keys(updatedStudents).forEach(p => {
                    if (updatedStudents[p].status === 'playing') {
                        const st = { ...updatedStudents[p] };
                        st.status = esercitazione ? 'published' : 'submitted';
                        st.submittedAt = Date.now();
                        st.closedScore = computeClosedScore(st, questions);
                        st.forced = true;   // consegna forzata: marchio per poterla annullare
                        updatedStudents[p] = st;
                    }
                });
                const updatedClasses = { ...db.classes, [cls]: { ...classData, students: updatedStudents } };
                onSyncUpdate(null, null, null, updatedClasses);
                setForceAllOpen(false);
            };

            // RIMETTE IN CORSO un singolo studente consegnato/pubblicato SENZA toccare le risposte.
            // Serve ad ANNULLARE una consegna forzata fatta per errore: l'alunno ritrova esattamente
            // il suo compito (answers, openAnswer, ordini) e continua da dove era.
            const riprendi = (pin) => {
                const cur = classData.students[pin];
                if (!cur) return;
                const st = { ...cur };
                st.status = 'playing';
                st.resumeAllowed = true;
                st.submittedAt = null;
                st.closedScore = null;
                st.graded = false;
                delete st.forced;   // non è più una consegna forzata pendente
                // answers, openAnswer, optionOrder, matchOrder, questionOrder restano INTATTI
                onSyncUpdate(cls, pin, st);
            };

            // ANNULLA CONSEGNA per tutta la classe: rimette in corso tutti gli studenti con forced:true.
            const annullaConsegnaClasse = () => {
                if (!classData) { setUndoAllOpen(false); return; }
                const updatedStudents = { ...classData.students };
                Object.keys(updatedStudents).forEach(p => {
                    if (updatedStudents[p].forced) {
                        const st = { ...updatedStudents[p] };
                        st.status = 'playing';
                        st.resumeAllowed = true;
                        st.submittedAt = null;
                        st.closedScore = null;
                        st.graded = false;
                        delete st.forced;
                        updatedStudents[p] = st;
                    }
                });
                const updatedClasses = { ...db.classes, [cls]: { ...classData, students: updatedStudents } };
                onSyncUpdate(null, null, null, updatedClasses);
                setUndoAllOpen(false);
            };

            const saveGrade = (pin, grades) => {
                const st = { ...classData.students[pin], openGrades: grades };
                st.graded = allOpenGraded(st, questions);
                st.closedScore = computeClosedScore(st, questions);
                onSyncUpdate(cls, pin, st);
                setGrading(null);
            };

            const requestGrade = (s) => {
                if (s.status === 'published') { setReopenPin(s.pin); }   // prova già pubblicata: chiedo conferma di riapertura
                else setGrading(s.pin);                                  // altrimenti correggo subito, senza blocchi
            };
            
            const doReopen = () => {
                const pin = reopenPin;
                const st = { ...classData.students[pin], status: 'submitted' };  // torna "consegnata": lo studente rivede "in attesa"
                onSyncUpdate(cls, pin, st);
                setReopenPin(null);
                setGrading(pin);
            };

            const pubblica = () => {
                const updatedStudents = { ...classData.students };
                Object.keys(updatedStudents).forEach(p => {
                    if (updatedStudents[p].status === 'submitted' || updatedStudents[p].status === 'published') {
                        // (21/09/2026) Si lavora su una COPIA della scheda, come negli altri pulsanti. Prima lo stato veniva
                        // cambiato sulla scheda stessa: da quando al cloud va solo la differenza (19/09), «prima» e «dopo»
                        // erano lo stesso oggetto, la differenza risultava vuota e al cloud arrivava solo «classe pubblicata».
                        // L'alunno restava su «Verifica consegnata» senza vedere i risultati.
                        const st = { ...updatedStudents[p] };
                        if (st.closedScore == null) st.closedScore = computeClosedScore(st, questions);
                        st.status = 'published';
                        updatedStudents[p] = st;
                    }
                });
                const updatedClasses = { ...db.classes, [cls]: { ...classData, published: true, students: updatedStudents } };
                onSyncUpdate(null, null, null, updatedClasses);
                setPubOpen(false);
            };

            const exportPDF = () => { setPrintingCls(cls); };

            const exportArchive = () => {
                if (!classData) { alert("Seleziona prima una classe."); return; }
                const svolta = Object.values(classData.students).filter(s => s.status === 'submitted' || s.status === 'published');
                if (svolta.length === 0) { alert("Nessun alunno ha ancora svolto la verifica in questa classe: non c'e' niente da archiviare."); return; }
                if (questions.length === 0) { alert("Nessuna verifica caricata: impossibile generare l'archivio."); return; }
                const html = buildArchiveHTML(cls, classData, questions, maxClosed, maxOpen, maxTotal);
                downloadFile(html, 'archivio_' + cls + '_' + oggiISO() + '.html', 'text/html');
            };

            // BACKUP della singola classe (stesso formato dei backup gia' in uso, con in piu' i quesiti)
            const exportBackup = () => {
                if (!classData) { alert("Seleziona prima una classe."); return; }
                const payload = {
                    app: 'verifiche-arte-bianca',
                    exportedAt: new Date().toISOString(),
                    classe: cls,
                    dati: { published: !!classData.published, esercitazione: !!classData.esercitazione, students: classData.students },
                    quesiti: questions,
                    examTitle: examTitle
                };
                downloadFile(JSON.stringify(payload, null, 2), 'backup_' + cls + '_' + oggiISO() + '.json', 'application/json');
            };

            // BACKUP completo (tutte le classi, ciascuna con la sua verifica): usato anche prima del reset totale
            const exportFullBackup = () => {
                const payload = {
                    app: 'verifiche-arte-bianca', full: true,
                    exportedAt: new Date().toISOString(),
                    classes: db.classes
                };
                downloadFile(JSON.stringify(payload, null, 2), 'backup_completo_' + oggiISO() + '.json', 'application/json');
            };

            const handleRestoreBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        // Backup di singola classe
                        if (parsed.classe && parsed.dati && parsed.dati.students) {
                            const studentsNorm = {};
                            Object.values(parsed.dati.students).forEach(s => { studentsNorm[String(s.pin)] = normalizzaStudente(s); });
                            const quesitiClasse = (Array.isArray(parsed.quesiti) && parsed.quesiti.length) ? parsed.quesiti : ((db.classes[parsed.classe] && db.classes[parsed.classe].questions) || []);
                            const titoloClasse = parsed.examTitle || ((db.classes[parsed.classe] && db.classes[parsed.classe].examTitle) || '');
                            const updatedClasses = { ...db.classes, [parsed.classe]: { published: !!parsed.dati.published, esercitazione: !!parsed.dati.esercitazione, students: studentsNorm, questions: quesitiClasse, examTitle: titoloClasse } };
                            onSyncUpdate(null, null, null, updatedClasses);
                            setCls(parsed.classe);
                            alert("Backup della classe " + parsed.classe + " ripristinato" + ((Array.isArray(parsed.quesiti) && parsed.quesiti.length) ? " (insieme alla verifica abbinata)." : "."));
                        // Backup completo
                        } else if (parsed.classes) {
                            const restored = {};
                            Object.keys(parsed.classes).forEach(c => {
                                const studentsNorm = {};
                                Object.values(parsed.classes[c].students || {}).forEach(s => { studentsNorm[String(s.pin)] = normalizzaStudente(s); });
                                restored[c] = { published: !!parsed.classes[c].published, esercitazione: !!parsed.classes[c].esercitazione, students: studentsNorm, questions: (parsed.classes[c].questions || (Array.isArray(parsed.questions) ? parsed.questions : [])), examTitle: (parsed.classes[c].examTitle || '') };
                            });
                            onSyncUpdate(null, null, null, restored);
                            const primo = Object.keys(restored)[0];
                            if (primo) setCls(primo);
                            alert("Backup completo ripristinato (" + Object.keys(restored).length + " classi).");
                        } else {
                            alert("Questo file non sembra un backup valido dell'applicazione.");
                        }
                    } catch (err) { alert("Errore nella lettura del file di backup."); }
                };
                reader.readAsText(file);
                e.target.value = "";
            };

            const doReset = () => {
                if (!cls || !db.classes[cls]) { setResetOpen(false); setResetText(""); return; }
                exportBackup();                // sicurezza: scarica il backup di QUESTA classe prima di rimuoverla
                const updated = { ...db.classes };
                delete updated[cls];           // rimuovo solo la classe selezionata (con la sua verifica); le altre restano intatte
                onSyncUpdate(null, null, null, updated);
                const rimaste = Object.keys(updated);
                setCls(rimaste[0] || "");
                setResetOpen(false);
                setResetText("");
                alert("Classe " + cls + " rimossa dal cloud (backup scaricato). Le altre classi restano attive.");
            };
            
            useEffect(() => {
                if (printingCls) {
                    const t = setTimeout(() => { window.print(); setPrintingCls(null); }, 300);
                    return () => clearTimeout(t);
                }
            }, [printingCls]);

            const gradingStudent = grading ? classData?.students[grading] : null;
            const counts = students.reduce((acc, s) => { acc[s.status] = (acc[s.status]||0)+1; return acc; }, {});
            const playingCount = counts['playing'] || 0;                                   // prove aperte, non ancora consegnate
            const scollegatiCount = students.filter(s => s.status === 'playing' && scollegati[String(s.pin)]).length;
            const alLavoroCount = playingCount - scollegatiCount;                          // di queste, quanti sono collegati adesso
            const forcedCount = students.filter(s => s.forced).length;

            return (
                <div className="flex-grow flex flex-col min-h-screen no-print">
                    <div className="bg-[#57534a] text-white">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-3">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center"><Icon name="shield" size={22}/></div>
                                <div className="leading-tight">
                                    <div className="font-extrabold text-lg">Cruscotto Docente</div>
                                    <div className="text-xs text-white/60">Mauro Becattini</div>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                {classesList.length > 0 && (
                                    <div className="relative">
                                        <select value={cls} onChange={e => setCls(e.target.value)} className="appearance-none bg-white/10 text-white font-bold rounded-xl pl-4 pr-9 py-2.5 outline-none cursor-pointer hover:bg-white/20">
                                            {classesList.map(c => <option key={c} value={c} className="text-[#57534a]">Classe {c}</option>)}
                                        </select>
                                        <span className="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"><Icon name="chevron" size={16}/></span>
                                    </div>
                                )}
                                {classData && (
                                    <button onClick={toggleEsercitazione} title="Attiva/disattiva la modalità esercitazione per questa classe"
                                        className={`rounded-xl px-3 py-2.5 font-bold flex items-center gap-2 text-sm transition-colors ${esercitazione ? 'bg-[#5c8b73] text-white hover:brightness-95' : 'bg-white/10 text-white hover:bg-white/20'}`}>
                                        <Icon name={esercitazione ? 'unlock' : 'lock'} size={16}/>
                                        <span className="flex flex-col leading-none text-left">
                                            <span className="text-[10px] uppercase tracking-widest opacity-70">Modalità</span>
                                            <span>{esercitazione ? 'Esercitazione' : 'Verifica'}</span>
                                        </span>
                                    </button>
                                )}
                                <button onClick={onExit} className="bg-white/10 hover:bg-white/20 rounded-xl px-3 py-2.5 font-bold flex items-center gap-1.5 text-sm"><Icon name="logout" size={16}/> Esci</button>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto w-full px-4 py-5 flex-grow">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                <h4 className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Caricamento Setup Primario</h4>
                                <div className="flex gap-2">
                                    <input type="file" accept=".json" ref={classInputRef} onChange={handleUploadClasse} className="hidden" />
                                    <button onClick={() => classInputRef.current.click()} className="flex-1 py-3 border-2 border-[#57534a] text-[#57534a] font-bold rounded-xl text-xs flex items-center justify-center gap-2 hover:bg-gray-50"><Icon name="users" size={16}/> Carica Alunni (JSON)</button>
                                    
                                    <input type="file" accept=".json" ref={testInputRef} onChange={handleUploadProva} className="hidden" />
                                    <button onClick={() => testInputRef.current.click()} className="flex-1 py-3 bg-[#57534a] text-white font-bold rounded-xl text-xs flex items-center justify-center gap-2 hover:bg-[#454138]"><Icon name="upload" size={16}/> Carica Quesiti (JSON)</button>
                                </div>
                            </div>
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-around">
                                <div className="text-center"><div className="text-2xl font-extrabold text-[#57534a]">{classesList.length}</div><div className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Classi</div></div>
                                <div className="text-center"><div className="text-2xl font-extrabold text-[#57534a]">{questions.length}</div><div className="text-[10px] font-bold text-gray-400 uppercase tracking-wide">Quesiti caricati</div>{examTitle && <div className="text-[11px] font-semibold text-[#57534a] mt-0.5">({examTitle})</div>}</div>
                            </div>
                        </div>

                        {classesList.length > 0 && (
                            <div className="fade-in">
                                {esercitazione && <div className="mb-3 bg-[#5c8b73]/10 text-[#3f6a52] text-sm font-semibold rounded-xl px-4 py-2.5 flex items-center gap-2"><Icon name="refresh" size={16}/> Modalità <b>Esercitazione</b> attiva per la classe {cls}: nessun blocco, voto immediato alla consegna e ritentativi liberi.</div>}
                                <div className="flex flex-wrap md:flex-nowrap items-center gap-1.5 mb-4">
                                    <button onClick={() => setPubOpen(true)} className="bg-[#5c8b73] text-white font-bold rounded-xl px-3 py-2.5 text-sm flex items-center gap-1.5 hover:brightness-95 scale-hover whitespace-nowrap"><Icon name="eye" size={16}/> Pubblica voti</button>
                                    <button onClick={() => setForceAllOpen(true)} disabled={playingCount === 0} className="bg-[#d99a4e] text-white font-bold rounded-xl px-3 py-2.5 text-sm flex items-center gap-1.5 hover:brightness-95 scale-hover disabled:opacity-30 whitespace-nowrap"><Icon name="send" size={16}/> Consegna classe{playingCount > 0 ? ` (${playingCount})` : ''}</button>
                                    {forcedCount > 0 && <button onClick={() => setUndoAllOpen(true)} title={`Annulla consegna classe (${forcedCount}) — rimette gli alunni in corso con le risposte intatte`} className="bg-[#b9a6d9] text-[#2f2740] font-bold rounded-xl px-3 py-2.5 text-sm flex items-center gap-1.5 hover:brightness-95 scale-hover whitespace-nowrap"><Icon name="refresh" size={16}/> Annulla</button>}
                                    <button onClick={exportPDF} className="bg-[#57534a] text-white font-bold rounded-xl px-3 py-2.5 text-sm flex items-center gap-1.5 hover:bg-[#454138] scale-hover whitespace-nowrap"><Icon name="print" size={16}/> Esporta PDF</button>
                                    <button onClick={exportArchive} className="bg-[#57534a] text-white font-bold rounded-xl px-3 py-2.5 text-sm flex items-center gap-1.5 hover:bg-[#454138] scale-hover whitespace-nowrap"><Icon name="archive" size={16}/> Esporta HTML</button>
                                    <button onClick={exportBackup} title="Scarica il backup di questa classe" className="bg-white border-2 border-[#57534a] text-[#57534a] font-bold rounded-xl px-3 py-2.5 text-sm flex items-center gap-1.5 hover:bg-gray-50 scale-hover whitespace-nowrap"><Icon name="download" size={16}/> Backup</button>
                                    <input type="file" accept=".json" ref={backupInputRef} onChange={handleRestoreBackup} className="hidden" />
                                    <button onClick={() => backupInputRef.current.click()} title="Ripristina Backup" className="bg-white border-2 border-[#57534a] text-[#57534a] font-bold rounded-xl px-3 py-2.5 text-sm flex items-center gap-1.5 hover:bg-gray-50 scale-hover whitespace-nowrap"><Icon name="refresh" size={16}/> Ripristina</button>
                                    <button onClick={() => setResetOpen(true)} title="Reset Classe" className="bg-white border-2 border-[#b4472f] text-[#b4472f] font-bold rounded-xl px-3 py-2.5 text-sm flex items-center gap-1.5 hover:bg-[#b4472f]/5 scale-hover ml-auto whitespace-nowrap"><Icon name="trash" size={16}/> Reset</button>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-5 gap-2 mb-4">
                                    {[['idle','Non iniziati'],['playing','In corso'],['locked','Bloccati'],['submitted','Consegnati'],['published','Pubblicati']].map(([k,label]) => (
                                        <div key={k} className="bg-white rounded-xl shadow-card border border-gray-100 px-3 py-2.5 text-center">
                                            <div className="text-2xl font-extrabold text-[#57534a]">{k === 'playing' ? alLavoroCount : (counts[k]||0)}</div>
                                            <div className="text-[11px] font-semibold text-[#827f75] uppercase tracking-wide">{label}</div>
                                            {k === 'playing' && scollegatiCount > 0 && <div className="text-[11px] font-semibold text-gray-400">+ {scollegatiCount} non collegat{scollegatiCount === 1 ? 'o' : 'i'}</div>}
                                        </div>
                                    ))}
                                </div>

                                {classData?.published && <div className="mb-3 bg-[#5c8b73]/10 text-[#3f6a52] text-sm font-semibold rounded-xl px-4 py-2.5 flex items-center gap-2"><Icon name="check" size={16}/> Risultati pubblicati online per la classe {cls}.</div>}

                                <div className="bg-white rounded-2xl shadow-card border border-gray-100 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm">
                                            <thead>
                                                <tr className="bg-gray-50 text-[#827f75] text-left">
                                                    <th className="px-4 py-3 font-bold">PIN</th>
                                                    <th className="px-4 py-3 font-bold">Studente</th>
                                                    <th className="px-4 py-3 font-bold">Stato</th>
                                                    <th className="px-4 py-3 font-bold text-center">Chiuse</th>
                                                    <th className="px-4 py-3 font-bold text-center">Aperte</th>
                                                    <th className="px-4 py-3 font-bold text-center">Totale</th>
                                                    <th className="px-4 py-3 font-bold text-center">%</th>
                                                    <th className="px-4 py-3 font-bold text-center">Voto</th>
                                                    <th className="px-4 py-3 font-bold text-right">Azioni</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {students.map(s => {
                                                    const submitted = s.status === 'submitted' || s.status === 'published';
                                                    const playing = s.status === 'playing';
                                                    const locked = s.status === 'locked';
                                                    const answeredCount = questions.filter(q => isAnswered(q, s)).length;
                                                    const bd = computeBreakdown(s, questions);
                                                    const hasOpen = bd.openMax > 0;
                                                    const tot = submitted ? bd.total : null;
                                                    const canView = submitted || (playing && !scollegati[String(s.pin)]);   // «Non collegato»: riga nuda, nessun pulsante
                                                    return (
                                                        <tr key={s.pin} className="border-t border-gray-100 hover:bg-gray-50/60">
                                                            <td className="px-4 py-3 font-mono font-bold text-[#57534a]">{s.pin}</td>
                                                            <td className="px-4 py-3 font-semibold text-[#262420] whitespace-nowrap">{nomeBreve(s.lastName, s.firstName)}{playing && rossi[String(s.pin)] && !scollegati[String(s.pin)] && <span className="dot-fuori" title="Ha abbassato o lasciato la pagina della prova"></span>}</td>
                                                            <td className="px-4 py-3">
                                                                <div className="flex items-center gap-2">
                                                                    <StatusBadge status={playing && scollegati[String(s.pin)] ? 'offline' : s.status}/>
                                                                    {playing && !scollegati[String(s.pin)] && <span title="Risposte date finora" className="text-xs font-bold text-[#57534a]">{answeredCount}/{questions.length}</span>}
                                                                </div>
                                                            </td>
                                                            <td className="px-4 py-3 text-center font-semibold text-[#57534a]">{submitted ? `${fmtN(bd.closedScore)}/${fmtN(bd.closedMax)}` : '—'}</td>
                                                            <td className="px-4 py-3 text-center font-semibold">{submitted ? (hasOpen ? (s.graded ? `${fmtN(bd.openScore)}/${fmtN(bd.openMax)}` : <span className="text-[#b4472f]">da valutare</span>) : '—') : '—'}</td>
                                                            <td className="px-4 py-3 text-center">{tot != null ? <span className="inline-flex items-center gap-1 font-extrabold text-[#57534a]">{fmtN(tot)}/{fmtN(bd.totalMax)}{s.status === 'published' && <Icon name="lock" size={12} className="text-[#5c8b73]" />}</span> : <span className="text-gray-400">—</span>}</td>
                                                            <td className="px-4 py-3 text-center font-bold text-[#57534a]">{tot != null ? `${Math.round(bd.percent)}%` : '—'}</td>
                                                            <td className="px-4 py-3 text-center">{tot != null ? <span className={`font-extrabold ${bd.percent >= SOGLIA_SUFFICIENZA ? 'text-[#5c8b73]' : 'text-[#b4472f]'}`}>{votoFromPercent(bd.percent)}</span> : <span className="text-gray-400">—</span>}</td>
                                                            <td className="px-4 py-3">
                                                                {/* Tre caselle di larghezza fissa: ogni pulsante ha la sua colonna, così Sfoglia / Riprendi / Riapri restano incolonnati qualunque sia la scritta */}
                                                                <div className="grid justify-end gap-1.5" style={{ gridTemplateColumns: 'repeat(3, 6.5rem)' }}>
                                                                    {locked && <button onClick={() => sblocca(s.pin)} style={{ gridRow: 1, gridColumn: 3 }} className="bg-[#aec8ce]/30 text-[#57534a] rounded-lg px-2.5 py-1.5 font-bold text-xs flex items-center justify-center gap-1 hover:bg-[#aec8ce]/60"><Icon name="unlock" size={14}/> Sblocca</button>}
                                                                    {playing && !scollegati[String(s.pin)] && <button onClick={() => consegnaForzata(s.pin)} title="Consegna forzata di questo studente" style={{ gridRow: 1, gridColumn: 2 }} className="bg-[#d99a4e]/20 text-[#8a5a1c] rounded-lg px-2.5 py-1.5 font-bold text-xs flex items-center justify-center gap-1 hover:bg-[#d99a4e]/40"><Icon name="send" size={14}/> Consegna</button>}
                                                                    {canView && <button onClick={() => setViewPin(s.pin)} style={{ gridRow: 1, gridColumn: 1 }} className="bg-gray-100 text-[#57534a] rounded-lg px-2.5 py-1.5 font-bold text-xs flex items-center justify-center gap-1 hover:bg-gray-200"><Icon name="eye" size={14}/> Sfoglia</button>}
                                                                    {submitted && <button onClick={() => riprendi(s.pin)} title="Rimetti in corso l'alunno con le risposte intatte (annulla la consegna)" style={{ gridRow: 1, gridColumn: 2 }} className="bg-[#b9a6d9]/25 text-[#4a3d63] rounded-lg px-2.5 py-1.5 font-bold text-xs flex items-center justify-center gap-1 hover:bg-[#b9a6d9]/50"><Icon name="refresh" size={14}/> Riprendi</button>}

        const GradingForm = ({ student, questions, onSave, onClose }) => {

            const setScore = (qid, max, v) => {

                                    <div className="text-xs font-bold text-[#57534a] uppercase mb-1">Risposta dell'alunno</div>
                                    <div className="bg-gray-50 rounded-xl p-3 text-sm whitespace-pre-wrap leading-relaxed mb-3 max-h-48 overflow-y-auto border">{txt || <span className="italic text-gray-400">Nessun testo presente.</span>}</div>
                                    <div className="flex items-center gap-2 mb-2">
                                        <label className="text-sm font-bold text-[#57534a]">Punteggio</label>
                                        <input type="number" min="0" max={q.points} step="0.1" value={grades[q.id] ? grades[q.id].score : 0}
                                            onChange={(e) => setScore(q.id, q.points, e.target.value)}
                                            className="w-24 p-2 rounded-lg border-2 border-gray-200 focus:border-[#57534a] outline-none text-center font-bold"/>
                                        <span className="text-sm text-[#827f75]">/ {fmtN(q.points)} punti</span>

                                    <textarea value={grades[q.id] ? grades[q.id].comment : ''} onChange={(e) => setComment(q.id, e.target.value)} rows={6}

                    </div>

                    <div className="grid grid-cols-2 gap-3 mt-5">
                        <button onClick={onClose} className="py-3 rounded-xl font-bold border-2 border-[#57534a] text-[#57534a] hover:bg-gray-50">Annulla</button>

        const PrintArea = ({ cls, classData, questions, maxClosed, maxOpen, maxTotal }) => {
            const students = Object.values(classData.students)
                .filter(s => s.status === 'submitted' || s.status === 'published')
                .sort((a,b) => profInCima(a,b) || (a.lastName+a.firstName).localeCompare(b.lastName+b.firstName));

            const describeAnswer = (q, s) => {
                const a = s.answers ? s.answers[q.id] : null;
                const sel = a ? a.selection : null;
                if (q.type === 'single') {
                    return <div style={{ marginLeft: 12 }}>
                        <div>Scelta: {sel != null ? q.options[sel] : <i>Non risposta</i>}</div>
                        {sel !== q.correctIndex && <div style={{ color: '#57534a' }}>Corretta: {q.options[q.correctIndex]}</div>}
                    </div>;
                }
                if (q.type === 'multi') {
                    const arr = Array.isArray(sel) ? sel : [];
                    return <div style={{ marginLeft: 12 }}>
                        <div>Selezionate: {arr.length ? arr.map(i => q.options[i]).join(' · ') : <i>Nessuna</i>}</div>
                        <div style={{ color: '#57534a' }}>Corrette: {(q.correctIndices||[]).map(i => q.options[i]).join(' · ')}</div>
                    </div>;
                }
                if (q.type === 'matching') {
                    return <div style={{ marginLeft: 12 }}>
                        {(q.pairs||[]).map((p, k) => {
                            const ch = sel && sel[p.item];
                            const ok = ch === p.match;
                            return <div key={k} style={{ color: ok ? '#3f6a52' : '#b4472f' }}>{p.item} → {ch || '—'} {ok ? '✓' : '✗'}{!ok && <span style={{ color: '#57534a' }}> (corretto: {p.match})</span>}</div>;

                return null;
            };

            const content = (
                <div style={{ fontFamily: '"Schibsted Grotesk", sans-serif', color: '#262420' }}>
                    {students.length === 0 && <div style={{ padding: 20 }}>Nessuna prova consegnata disponibile per la stampa.</div>}
                    {students.map(s => {
                        const bd = computeBreakdown(s, questions);
                        const percent = bd.totalMax ? Math.round(bd.percent) : 0;
                        const ordered = orderedQuestions(s, questions);
                        const hasClosed = bd.closedMax > 0, hasOpen = bd.openMax > 0;
                        return (
                            <div key={s.pin} className="print-student" style={{ padding: '4mm 0' }}>
                                <div style={{ borderBottom: '3px solid #57534a', paddingBottom: 8, marginBottom: 14 }}>
                                    <div style={{ fontSize: 11, letterSpacing: 1, textTransform: 'uppercase', color: '#827f75' }}>Report Esito Verifiche Live Cloud</div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginTop: 4 }}>
                                        <div style={{ fontSize: 22, fontWeight: 800, color: '#57534a' }}>{s.lastName} {s.firstName}</div>
                                        <div style={{ fontWeight: 700 }}>Classe {cls} · PIN {s.pin}</div>
                                    </div>
                                    <div style={{ marginTop: 6, fontWeight: 700 }}>
                                        Punteggio: {fmtN(bd.total)}/{fmtN(bd.totalMax)} ({percent}%)
                                        {hasClosed && <span> — Chiuse {fmtN(bd.closedScore)}/{fmtN(bd.closedMax)}</span>}
                                        {hasOpen && <span>, Aperte {fmtN(bd.openScore)}/{fmtN(bd.openMax)}</span>}
                                        {' '}— Voto {votoFromPercent(bd.percent)}

                </div>
            );
            return ReactDOM.createPortal(content, document.getElementById('print-area'));
        };

        const buildArchiveHTML = (cls, classData, questions, maxClosed, maxOpen, maxTotal) => {
            // Solo gli alunni che hanno effettivamente svolto la prova (gli assenti restano fuori)
            const studentsDone = {};
            Object.values(classData.students).forEach(s => {
                if (s.status === 'submitted' || s.status === 'published') studentsDone[String(s.pin)] = s;
            });
            const examTitle = (classData && classData.examTitle) || '';
            const payload = { cls, examTitle, generatedAt: new Date().toISOString(), SOGLIA: SOGLIA_SUFFICIENZA, maxClosed, maxOpen, maxTotal, questions, students: studentsDone };
            const dataJson = JSON.stringify(payload).replace(/</g, '\\u003c');

            const archScript = `
                const { useState } = React;
                const D = window.__ARCHIVE__;
                const Q = D.questions;
                const SOGLIA = D.SOGLIA;
                const fmtN = function(n){ return parseFloat(Number(n||0).toFixed(2)).toString().replace('.', ','); };
                const votoFromPercent = function(percent){
                    var p = Math.round(percent);
                    if (p <= 30) return "3";
                    var t = [[41,"4"],[43,"4+"],[46,"4,5"],[48,"5-"],[51,"5"],[53,"5+"],[56,"5,5"],[58,"6-"],[61,"6"],[63,"6+"],[66,"6,5"],[68,"7-"],[71,"7"],[73,"7+"],[76,"7,5"],[78,"8-"],[81,"8"],[83,"8+"],[86,"8,5"],[88,"9-"],[91,"9"],[93,"9+"],[96,"9,5"],[98,"10-"],[100,"10"]];
                    for (var k=0;k<t.length;k++){ if (p<=t[k][0]) return t[k][1]; }
                    return "10";
                };
                const pointsFor = function(q, s){
                    if(q.type==='open'){ var g=s.openGrades&&s.openGrades[q.id]; return (g&&g.score!=null)?g.score:0; }
                    var a=s.answers&&s.answers[q.id]; if(!a||a.selection==null) return 0; var sel=a.selection;
                    if(q.type==='single') return sel===q.correctIndex?q.points:0;
                    if(q.type==='multi'){ if(!Array.isArray(sel)) return 0; var c=sel.filter(function(i){return (q.correctIndices||[]).indexOf(i)>=0;}).length; var w=sel.length-c; if(w===0&&c===2) return q.points; if(w===0&&c===1) return 0.5; return 0; }
                    if(q.type==='matching'){ var pairs=q.pairs||[]; var tot=pairs.length||4; var ok=0; pairs.forEach(function(p){ if(sel&&sel[p.item]===p.match) ok++; }); if(ok===tot) return q.points; if(ok>=2) return 0.5; return 0; }
                    return 0;
                };
                const breakdown = function(s){
                    var cs=0,cm=0,os=0,om=0;
                    Q.forEach(function(q){ var p=pointsFor(q,s); if(q.type==='open'){os+=p;om+=q.points;} else {cs+=p;cm+=q.points;} });
                    var total=cs+os, totalMax=cm+om;
                    return {closedScore:cs,closedMax:cm,openScore:os,openMax:om,total:total,totalMax:totalMax,percent: totalMax?(total/totalMax*100):0};
                };
                const ordered = function(s){
                    var ord=s.questionOrder; if(Array.isArray(ord)&&ord.length){ var byId={}; Q.forEach(function(q){byId[q.id]=q;}); var list=ord.map(function(id){return byId[id];}).filter(Boolean); Q.forEach(function(q){ if(ord.indexOf(q.id)<0) list.push(q); }); return list; } return Q;
                };
                const students = Object.keys(D.students).map(function(k){ return D.students[k]; }).sort(function(a,b){ var pr=function(s){ var n=(s.lastName||'')+' '+(s.firstName||''); return /\bbecattini\b/i.test(n) && /\bmauro\b/i.test(n); }; return ((pr(b)?1:0)-(pr(a)?1:0)) || (a.lastName+a.firstName).localeCompare(b.lastName+b.firstName); });

                function QView(props){
                    var q=props.q, s=props.s;
                    var a=s.answers&&s.answers[q.id];
                    var sel=a?a.selection:null;
                    if(q.type==='single' || q.type==='multi'){
                        var picks = q.type==='multi' ? (Array.isArray(sel)?sel:[]) : (sel!=null?[sel]:[]);
                        var corr = q.type==='multi' ? (q.correctIndices||[]) : [q.correctIndex];
                        return (
                            <div className="space-y-2">
                                {q.options.map(function(opt,idx){
                                    var isSel=picks.indexOf(idx)>=0; var isCor=corr.indexOf(idx)>=0;
                                    var stl="bg-gray-50 text-gray-400 border-transparent";
                                    if(isCor) stl="bg-[#5c8b73] text-white border-[#5c8b73]";
                                    else if(isSel) stl="bg-[#b4472f] text-white border-[#b4472f]";
                                    return <div key={idx} className={"p-3 rounded-xl text-sm font-medium border flex items-center justify-between "+stl}><span>{opt}</span><span className="text-xs font-extrabold">{isCor?"✓":(isSel?"✗":"")}</span></div>;
                                })}
                            </div>
                        );
                    }
                    if(q.type==='matching'){
                        return (
                            <div className="space-y-2">
                                {(q.pairs||[]).map(function(p,k){
                                    var ch=sel&&sel[p.item]; var ok=ch===p.match;
                                    return <div key={k} className={"p-3 rounded-xl border text-sm "+(ch?(ok?"border-[#5c8b73] bg-[#5c8b73]/5":"border-[#b4472f] bg-[#b4472f]/5"):"border-gray-300")}><div className="font-semibold text-[#262420]">{p.item}</div><div className={ok?"text-[#3f6a52]":"text-[#b4472f]"}>{ch||"—"} {ch?(ok?"✓":"✗"):""}</div>{!ok?<div className="text-[#57534a] text-xs mt-1">Corretto: {p.match}</div>:null}</div>;
                                })}
                            </div>
                        );
                    }
                    var txt=(a&&typeof a.selection==='string')?a.selection:'';
                    var g=s.openGrades&&s.openGrades[q.id];
                    return (
                        <div>
                            <div className="bg-gray-50 rounded-xl p-4 text-sm whitespace-pre-wrap leading-relaxed text-[#262420]">{txt||"—"}</div>
                            {g&&g.comment?<div className="bg-[#aec8ce]/20 rounded-xl p-4 text-sm mt-3"><div className="text-xs font-bold text-[#57534a] uppercase mb-1">Commento del docente</div><div className="text-[#262420] leading-relaxed whitespace-pre-wrap">{g.comment}</div></div>:null}
                        </div>
                    );
                }

                function Dettaglio(props){
                    var s=props.student; var bd=breakdown(s);
                    var pct=bd.totalMax?Math.round(bd.percent):0; var voto=votoFromPercent(bd.percent); var passed=pct>=SOGLIA;
                    var list=ordered(s); var hasClosed=bd.closedMax>0, hasOpen=bd.openMax>0;
                    return (
                        <div className="max-w-2xl mx-auto px-4 py-6">
