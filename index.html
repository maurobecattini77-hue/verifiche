                                <div className="flex justify-between items-start">
                                    <div><div className="text-xs font-bold text-gray-400 uppercase tracking-widest">Classe {D.cls} · PIN {s.pin}</div><h2 className="text-2xl font-extrabold text-[#57534a]">{s.lastName} {s.firstName}</h2></div>
                                    <div className="text-right"><div className={"text-4xl font-extrabold "+(passed?"text-[#5c8b73]":"text-[#b4472f]")}>{voto}</div><div className="text-xs font-semibold text-[#827f75] mt-1">{fmtN(bd.total)}/{fmtN(bd.totalMax)} · {pct}%</div></div>
                                </div>
                                <div className="flex flex-wrap gap-2 mt-3 text-xs font-semibold">
                                    {hasClosed?<span className="bg-gray-100 rounded-lg px-3 py-1.5 text-[#57534a]">Chiuse {fmtN(bd.closedScore)}/{fmtN(bd.closedMax)}</span>:null}
                                    {hasOpen?<span className="bg-[#b9a6d9]/25 rounded-lg px-3 py-1.5 text-[#5e4e70]">Aperte {fmtN(bd.openScore)}/{fmtN(bd.openMax)}</span>:null}
                                    <span className="bg-[#57534a] text-white rounded-lg px-3 py-1.5">Totale {fmtN(bd.total)}/{fmtN(bd.totalMax)}</span>
                                </div>
                            </div>
                            {list.map(function(q,i){
                                var pts=pointsFor(q,s); var isOpen=q.type==='open'; var ans=s.answers&&s.answers[q.id];
                                var answered = isOpen ? (ans&&typeof ans.selection==='string'&&ans.selection.trim().length>0) : (ans&&ans.selection!=null);
                                var border, badge, btxt;
                                if(isOpen){ border="border-[#b9a6d9]"; badge="bg-[#b9a6d9]/25 text-[#5e4e70]"; btxt=fmtN(pts)+"/"+fmtN(q.points)+" pt"; }
                                else if(!answered){ border="border-gray-300"; badge="bg-gray-200 text-gray-600"; btxt="NON RISPOSTA"; }
                                else if(Math.abs(pts-q.points)<0.01){ border="border-[#5c8b73]"; badge="bg-[#5c8b73]/10 text-[#5c8b73]"; btxt="CORRETTA"; }
                                else if(pts>0){ border="border-[#ebc871]"; badge="bg-[#ebc871]/20 text-[#827f75]"; btxt="PARZIALE"; }
                                else { border="border-[#b4472f]"; badge="bg-[#b4472f]/10 text-[#b4472f]"; btxt="ERRATA"; }
                                return (
                                    <div key={q.id} className={"bg-white p-5 rounded-2xl shadow-sm border-l-8 mb-4 "+border}>
                                        <div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-gray-400 uppercase tracking-widest">Domanda {i+1}</span><span className={"text-xs font-bold px-2 py-1 rounded "+badge}>{btxt}</span></div>
                                        <p className="font-bold text-[#262420] mb-3 leading-relaxed">{q.question}</p>
                                        <QView q={q} s={s} />
                                        {(!isOpen&&q.explanation)?<div className="mt-4 pt-3 border-t border-gray-100"><div className="text-xs font-bold text-[#57534a] uppercase mb-1">Spiegazione</div><p className="text-sm text-[#827f75] leading-relaxed">{q.explanation}</p></div>:null}
                                    </div>
                                );
                            })}
                        </div>
                    );
                }

                function ArchiveApp(){
                    const [sel,setSel]=useState(null);
                    if(sel&&D.students[sel]) return <Dettaglio student={D.students[sel]} back={function(){setSel(null);}} />;
                    return (
                        <div>
                            <div className="bg-[#57534a] text-white"><div className="max-w-5xl mx-auto px-4 py-5"><div className="text-[11px] uppercase tracking-widest text-white/60">Arte Bianca di Neive · Archivio verifica{D.examTitle ? " (" + D.examTitle + ")" : ""}</div><div className="text-2xl font-extrabold">Classe {D.cls}</div><div className="text-xs text-white/70 mt-0.5">prof. Mauro Becattini · generato il {new Date(D.generatedAt).toLocaleString('it-IT')} · {students.length} alunni</div></div></div>
                            <div className="max-w-5xl mx-auto px-4 py-6">
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-sm text-left">
                                    <thead className="bg-gray-50 text-[#827f75] text-xs uppercase"><tr><th className="px-4 py-3">PIN</th><th className="px-4 py-3">Studente</th><th className="px-4 py-3 text-center">Chiuse</th><th className="px-4 py-3 text-center">Aperte</th><th className="px-4 py-3 text-center">Totale</th><th className="px-4 py-3 text-center">%</th><th className="px-4 py-3 text-center">Voto</th><th></th></tr></thead>
                                    <tbody>
                                        {students.map(function(s){
                                            var bd=breakdown(s); var pct=bd.totalMax?Math.round(bd.percent):0; var voto=votoFromPercent(bd.percent); var hasOpen=bd.openMax>0;
                                            return (
                                                <tr key={s.pin} onClick={function(){setSel(s.pin);}} className="border-t border-gray-100 hover:bg-gray-50 cursor-pointer">
                                                    <td className="px-4 py-3 font-mono font-bold text-[#57534a]">{s.pin}</td>
                                                    <td className="px-4 py-3 font-semibold whitespace-nowrap">{s.lastName} {s.firstName}</td>
                                                    <td className="px-4 py-3 text-center font-semibold text-[#57534a]">{fmtN(bd.closedScore)+"/"+fmtN(bd.closedMax)}</td>
                                                    <td className="px-4 py-3 text-center font-semibold">{hasOpen?(fmtN(bd.openScore)+"/"+fmtN(bd.openMax)):"—"}</td>
                                                    <td className="px-4 py-3 text-center font-extrabold text-[#57534a]">{fmtN(bd.total)+"/"+fmtN(bd.totalMax)}</td>
                                                    <td className={"px-4 py-3 text-center font-extrabold "+(pct>=SOGLIA?"text-[#5c8b73]":"text-[#b4472f]")}>{pct+"%"}</td>
                                                    <td className="px-4 py-3 text-center font-bold">{voto}</td>
                                                    <td className="px-4 py-3 text-right text-gray-300">&rsaquo;</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table></div></div>
                                <div className="mt-4 text-xs text-[#827f75] text-center">Clicca su un alunno per vedere la verifica completa, con risposte corrette, spiegazioni e correzione delle aperte.</div>
                            </div>
                        </div>
                    );
                }
                ReactDOM.createRoot(document.getElementById('root')).render(<ArchiveApp/>);
            `;

            return [
                '<!DOCTYPE html>',
                '<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">',
                '<title>Archivio verifica ' + cls + ' — Arte Bianca di Neive</title>',
                '<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin><\/script>',
                '<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin><\/script>',
                '<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>',
                '<script src="https://cdn.tailwindcss.com"><\/script>',
                '<style>@import url(\'https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap\');body{font-family:"Schibsted Grotesk",sans-serif;letter-spacing:-0.01em;background:#eef0ea;color:#262420;}h1,h2,h3{font-family:"Fraunces",serif;}</style>',
                '</head><body><div id="root"></div>',
                '<script>window.__ARCHIVE__ = ' + dataJson + ';<\/script>',
                '<script type="text/babel">' + archScript + '<\/script>',
                '</body></html>'
            ].join('\n');
        };

        /* =====================================================================
           CORE CORE CORE DIRECTING DISPATCHER CON SYNC REALTIME CLOUD
        ===================================================================== */
        // Chi bussa con un PIN gia' in uso: stessa schermata rossa di sempre. Ribussa da solo ogni 5 secondi.
        const SchermoBloccato = ({ nome }) => (
            <div className="flex-grow flex flex-col items-center justify-center p-6 bg-[#b4472f] text-white text-center fade-in min-h-screen">
                <div className="pulse-red"><Icon name="lock" size={70} /></div>
                <h1 className="text-3xl font-extrabold mt-6">Accesso bloccato</h1>
                <p className="mt-3 text-white/90 max-w-xs font-medium">Hai già effettuato l'accesso in precedenza. Per continuare, devi chiedere lo sblocco al docente.</p>
                {nome && <div className="mt-6 bg-white/15 rounded-2xl px-5 py-3 font-bold tracking-wide">{nome}</div>}
            </div>
        );

        // La prova e' passata a un altro dispositivo (dopo lo «Sblocca» del docente): questa pagina non scrive piu'.
        const SessioneChiusa = ({ onTorna }) => (
            <div className="flex-grow flex flex-col items-center justify-center p-6 text-center fade-in">
                <div className="w-20 h-20 rounded-full bg-gray-200 text-[#57534a] flex items-center justify-center"><Icon name="lock" size={40}/></div>
                <h1 className="text-2xl font-extrabold text-[#57534a] mt-6">Sessione chiusa</h1>
                <p className="mt-3 text-[#827f75] max-w-xs font-medium">La tua prova è aperta su un altro dispositivo. Il lavoro fatto fin qui è salvo.</p>
                <button onClick={onTorna} className="mt-6 py-3 px-6 rounded-xl font-bold bg-[#57534a] text-white hover:bg-[#454138]">Torna all'ingresso</button>
            </div>
        );

        const App = () => {
            const [view, setView] = useState('landing');     // landing | student | bloccato | chiusa | admin
            const [vista, setVista] = useState(null);         // ALUNNO: la sua scheda, come gliela da' il cloud
            const [bussa, setBussa] = useState(null);         // ALUNNO respinto: { pin, nome }
            const [db, setDb] = useState({ version: 1, classes: {} });   // DOCENTE: la scheda di tutti
            const [loading, setLoading] = useState(true);

            /* ================= DOCENTE =================
               Le scritture verso il cloud: una CODA di pezzetti, spediti in fila. Se la rete cade si riprova da
               soli; se arriva un pezzetto nuovo per lo stesso percorso sostituisce quello ancora in attesa.
               Dal 19/09/2026 la scheda di tutti la legge e la scrive SOLO il docente riconosciuto dal cloud
               (porte ver_doc_leggi e ver_applica, che controllano cf_e_docente). */
            const classesRef = useRef({});     // l'ultima fotografia locale (cloud + cio' che ho scritto io)
            const codaRef = useRef([]);        // pezzetti da spedire
            const voloRef = useRef([]);        // pezzetti spediti, in attesa di conferma
            const fatteRef = useRef([]);       // pezzetti confermati da poco: { op, doneAt }
            const inviandoRef = useRef(false);
            const tokenRef = useRef(null);     // il riconoscimento del docente, per l'ultimo invio a pagina che si chiude
            const viewRef = useRef('landing');
            useEffect(() => { viewRef.current = view; }, [view]);

            useEffect(() => {
                supabase.auth.getSession().then(({ data }) => { tokenRef.current = (data && data.session) ? data.session.access_token : null; }).catch(() => {});
                const { data: sub } = supabase.auth.onAuthStateChange((_e, session) => { tokenRef.current = session ? session.access_token : null; });
                return () => { try { sub.subscription.unsubscribe(); } catch (e) { } };
            }, []);

            const pullCloudState = async () => {
                const t0 = Date.now();
                const { data, error } = await supabase.rpc('ver_doc_leggi');
                if (viewRef.current !== 'admin') return;
                if (!error && data) {
                    let classes = (data && data.classes) || {};
                    // Una lettura partita PRIMA che una mia scrittura fosse confermata puo' non contenerla ancora:
                    // gliela rimetto sopra. Le scritture confermate prima che questa lettura partisse ci sono gia' dentro.
                    fatteRef.current = fatteRef.current.filter(x => x.doneAt > t0);
                    const sopra = [...fatteRef.current.map(x => x.op), ...voloRef.current, ...codaRef.current];
                    if (sopra.length) classes = applicaOps(classes, sopra);
                    classesRef.current = classes;
                    setDb({ version: 1, classes });
                } else if (!error && data === null) {
                    // Il cloud non mi riconosce piu' come docente (collegamento scaduto): non resto su un cruscotto muto.
                    try { sessionStorage.removeItem(DOCENTE_KEY); } catch (e) { }
                    setView('landing');
                    alert("Il collegamento da docente è scaduto: rientra con email e password.");
                }
            };

            const spedisci = async () => {
                if (inviandoRef.current || codaRef.current.length === 0) return;
                inviandoRef.current = true;
                voloRef.current = codaRef.current; codaRef.current = [];
                let ok = false;
                try {
                    const { data, error } = await supabase.rpc('ver_applica', { p_ops: voloRef.current });
                    ok = !error && data === true;
                } catch (e) { ok = false; }
                if (ok) {
                    const ora = Date.now();
                    voloRef.current.forEach(op => fatteRef.current.push({ op, doneAt: ora }));
                    voloRef.current = [];
                    inviandoRef.current = false;
                    if (codaRef.current.length) spedisci();
                } else {
                    // Non e' arrivato: rimetto i pezzetti in testa alla coda (tranne quelli gia' superati da uno
                    // piu' nuovo sullo stesso percorso) e riprovo fra poco. Il lavoro non si butta mai.
                    const nuovi = {}; codaRef.current.forEach(op => { nuovi[chiaveOp(op)] = true; });
                    codaRef.current = [...voloRef.current.filter(op => !nuovi[chiaveOp(op)]), ...codaRef.current];
                    voloRef.current = [];
                    inviandoRef.current = false;
                    setTimeout(spedisci, 1500);
                }
            };
            const accoda = (ops) => {
                ops.forEach(op => {
                    const k = chiaveOp(op);
                    codaRef.current = codaRef.current.filter(x => chiaveOp(x) !== k);
                    codaRef.current.push(op);
                });
                spedisci();
            };

            // Cruscotto che si chiude con qualcosa ancora da spedire: parte comunque, con keepalive.
            useEffect(() => {
                const ultimoInvio = () => {
                    const resto = [...voloRef.current, ...codaRef.current];
                    if (!resto.length || !tokenRef.current) return;
                    try {
                        fetch(SUPABASE_URL + '/rest/v1/rpc/ver_applica', {
                            method: 'POST', keepalive: true,
                            headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + tokenRef.current },
                            body: JSON.stringify({ p_ops: resto })
                        }).catch(() => {});
                    } catch (e) { }
                };
                window.addEventListener('pagehide', ultimoInvio);
                return () => window.removeEventListener('pagehide', ultimoInvio);
            }, []);

            // La scheda di tutti si rilegge ogni 3 secondi SOLO dal cruscotto del docente.
            useEffect(() => {
                if (view !== 'admin') return;
                pullCloudState();
                const intervalId = setInterval(pullCloudState, 3000);
                return () => clearInterval(intervalId);
            }, [view]);

            // Stessa firma di prima (la usano tutti i punti del cruscotto), ma al cloud va SOLO la differenza.
            const syncUpdateCloud = async (cls, pin, updatedStudentData, fullClasses = null) => {
                const base = classesRef.current || {};
                let next;
                if (fullClasses) next = fullClasses;
                else if (cls && pin && updatedStudentData && base[cls]) {
                    next = { ...base, [cls]: { ...base[cls], students: { ...(base[cls].students || {}), [pin]: updatedStudentData } } };
                } else return;
                const ops = diffClassi(base, next);
                classesRef.current = next;
                setDb({ version: 1, classes: next });
                if (ops.length) accoda(ops);
            };

            const resetDatabaseCloud = async () => {
                classesRef.current = {};
                setDb({ version: 1, classes: {} });
                accoda([{ p: ['classes'], v: {} }]);
            };

            /* ================= ALUNNO =================
               Regole di PIN, presenza e blocco: le stesse di Cedolino Facile. Un orologio solo: collegato = battito
               negli ultimi 20 secondi, e si batte ogni 5. Le decide il cloud (ver_entra), non questa pagina. */
            const sessRef = useRef(null);          // { pin, sess }: il gettone che il cloud da' all'ingresso
            const vistaRef = useRef(null);
            const pendRef = useRef({});            // risposte da spedire: { idDomanda: selezione }
            const inVoloRef = useRef({});          // risposte spedite, in attesa di conferma
            const inviandoRispRef = useRef(false);
            const rifiutiRef = useRef(0);
            const battitoVoloRef = useRef(0);
            const salutatoRef = useRef(false);     // la pagina ha gia' detto «mi chiudo»: dopo, tace
            /* (20/09/2026) TRE DIFESE IN PIU' PER LA RETE DEBOLE.
               toccateRef: tutte le risposte date in QUESTA apertura della pagina. Si rimettono sempre sopra la scheda che
                 arriva dal cloud finche' la prova e' in corso: prima si proteggevano solo quelle ancora per strada, e una
                 scheda partita PRIMA dell'ultima battuta ma arrivata DOPO la sua conferma riportava indietro il testo.
               copia locale: le risposte non ancora confermate dal cloud stanno anche nella memoria del dispositivo, col
                 gettone della sessione. Se la rete cade e l'alunno ricarica la pagina, al ritorno (stesso gettone) si
                 rimettono in coda: prima vivevano solo nella memoria della pagina e un F5 senza rete le perdeva.
               vistaSeq/vistaVolo: una lettura della scheda alla volta, e una risposta vecchia non scavalca una nuova. */
            const toccateRef = useRef({});
            const vistaSeqRef = useRef(0);
            const vistaVoloRef = useRef(0);
            const ritentaRef = useRef(null);
            const annullaRipristinoRef = useRef(false);
            const [reteDebole, setReteDebole] = useState(false);
            const chiaveLocale = (pin) => 'ver_risposte_' + pin;
            const scriviLocale = () => {
                const se = sessRef.current; if (!se) return;
                try {
                    const r = { ...inVoloRef.current, ...pendRef.current };
                    if (Object.keys(r).length) localStorage.setItem(chiaveLocale(se.pin), JSON.stringify({ t: Date.now(), sess: se.sess || null, r }));
                    else localStorage.removeItem(chiaveLocale(se.pin));
                } catch (e) { }
            };
            const leggiLocale = (pin, sess) => {
                try {
                    const j = JSON.parse(localStorage.getItem(chiaveLocale(pin)) || 'null');
                    // Vale SOLO per la stessa sessione (stesso gettone) e per sei ore: se nel frattempo l'alunno ha lavorato
                    // da un altro dispositivo il gettone e' cambiato, e queste risposte vecchie non devono tornare sopra.
                    if (j && j.r && typeof j.r === 'object' && j.sess && j.sess === (sess || null) && Date.now() - (j.t || 0) < 6 * 3600 * 1000) return j.r;
                } catch (e) { }
                return {};
            };
            const buttaLocale = (pin) => { try { if (pin) localStorage.removeItem(chiaveLocale(pin)); } catch (e) { } };

            const salvaSessione = (pin, sess) => {
                sessRef.current = { pin, sess: sess || null };
                try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ pin, sess: sess || null })); } catch (e) { }
            };
            const dimenticaSessione = () => {
                if (sessRef.current) buttaLocale(sessRef.current.pin);
                toccateRef.current = {};
                sessRef.current = null; vistaRef.current = null; pendRef.current = {}; inVoloRef.current = {};
                try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { }
            };
            const tornaIngresso = () => { dimenticaSessione(); setVista(null); setBussa(null); setView('landing'); };
            const chiaviSessione = () => ({ p_pin: sessRef.current.pin, p_sess: sessRef.current.sess, p_dispositivo: codiceDispositivo() });

            // La scheda che arriva dal cloud non deve far tornare indietro una risposta appena data e non ancora confermata.
            const mettiVista = (v) => {
                if (v && v.student && v.student.status === 'playing') {
                    const sopra = { ...toccateRef.current, ...inVoloRef.current, ...pendRef.current };
                    if (Object.keys(sopra).length) {
                        const answers = { ...(v.student.answers || {}) };
                        Object.keys(sopra).forEach(k => { answers[k] = { selection: sopra[k] }; });
                        v = { ...v, student: { ...v.student, answers } };
                    }
                }
                vistaRef.current = v; setVista(v);
            };

            const ricaricaVista = async () => {
                const se = sessRef.current; if (!se) return;
                // una lettura alla volta (rete lenta: prima se ne accodavano anche cinque, e una vecchia scavalcava una nuova)
                if (vistaVoloRef.current && Date.now() - vistaVoloRef.current < 8000) return;
                vistaVoloRef.current = Date.now();
                const mia = ++vistaSeqRef.current;
                try {
                    const r = await porta('ver_mio', chiaviSessione());
                    if (sessRef.current !== se || mia !== vistaSeqRef.current) return;
                    if (r && r.ok && r.vista) mettiVista(r.vista);
                    else if (r && r.sparito) tornaIngresso();
                } catch (e) { }
                finally { if (mia === vistaSeqRef.current) vistaVoloRef.current = 0; }
            };

            const batti = async (fuori, subito) => {
                const se = sessRef.current;
                if (!se || salutatoRef.current) return;
                // rete lenta: se un battito e' per strada da meno di 8 secondi non ne accodo un altro (i segnali di uscita si')
                if (!subito && battitoVoloRef.current && Date.now() - battitoVoloRef.current < 8000) return;
                const mioBattito = Date.now();
                battitoVoloRef.current = mioBattito;
                let r = null;
                try { r = await porta('ver_battito', { ...chiaviSessione(), p_fuori: !!fuori, p_seq: prossimoSeq() }, true); } catch (e) { }
                if (battitoVoloRef.current === mioBattito) battitoVoloRef.current = 0;
                if (!r || sessRef.current !== se) return;
                if (r.sparito) { tornaIngresso(); return; }
                if (r.ok === false) {
                    rifiutiRef.current++;
                    if (rifiutiRef.current >= 2) { dimenticaSessione(); setVista(null); setView('chiusa'); }
                    return;
                }
                rifiutiRef.current = 0;
                if (r.status === 'idle') { tornaIngresso(); return; }      // il docente ha ricaricato o azzerato la classe
                const v = vistaRef.current;
                if (v && r.impronta && r.impronta !== v.impronta) ricaricaVista();
            };

            const spedisciRisposte = async () => {
                if (inviandoRispRef.current || !sessRef.current || Object.keys(pendRef.current).length === 0) return;
                const se = sessRef.current;
                inviandoRispRef.current = true;
                inVoloRef.current = pendRef.current; pendRef.current = {};
                let r = null;
                try { r = await porta('ver_rispondi', { ...chiaviSessione(), p_risposte: inVoloRef.current }); } catch (e) { r = null; }
                if (sessRef.current !== se) { inviandoRispRef.current = false; return; }
                if (r && r.ok) {
                    inVoloRef.current = {}; inviandoRispRef.current = false;
                    scriviLocale();
                    if (Object.keys(pendRef.current).length) spedisciRisposte();
                } else if (r && r.ok === false && r.status) {
                    // la prova non e' piu' in corso (consegna forzata dal docente): cio' che era salvo resta salvo
                    inVoloRef.current = {}; pendRef.current = {}; inviandoRispRef.current = false;
                    toccateRef.current = {}; scriviLocale();
                    ricaricaVista();
                } else {
                    // rete caduta, oppure gettone rifiutato (lo decide il battito se la sessione e' chiusa): non butto niente
                    pendRef.current = { ...inVoloRef.current, ...pendRef.current }; inVoloRef.current = {};
                    inviandoRispRef.current = false;
                    if (r && r.ok === false) batti(document.visibilityState === 'hidden' || !document.hasFocus(), true);
                    // UN SOLO ritentativo armato: prima ne nasceva uno per ogni tasto battuto a rete assente
                    if (ritentaRef.current) clearTimeout(ritentaRef.current);
                    ritentaRef.current = setTimeout(() => { ritentaRef.current = null; spedisciRisposte(); }, r ? 3000 : 1500);
                }
            };

            const rispondi = (qid, selection) => {
                const v = vistaRef.current;
                if (!v || !v.student || v.student.status !== 'playing') return;
                const nv = { ...v, student: { ...v.student, answers: { ...(v.student.answers || {}), [qid]: { selection } } } };
                vistaRef.current = nv; setVista(nv);
                pendRef.current = { ...pendRef.current, [qid]: selection };
                toccateRef.current = { ...toccateRef.current, [qid]: selection };
                scriviLocale();
                spedisciRisposte();
            };

            // La consegna porta con se' TUTTE le risposte che ho sullo schermo: cosi' l'ultima lettera non resta per strada.
            const consegna = async () => {
                const se = sessRef.current, v = vistaRef.current;
                if (!se || !v) return false;
                const tutte = {};
                Object.keys(v.student.answers || {}).forEach(k => { const a = v.student.answers[k]; if (a && a.selection !== undefined && a.selection !== null) tutte[k] = a.selection; });
                try {
                    const r = await portaPaziente('ver_consegna', { ...chiaviSessione(), p_risposte: tutte }, 4);
                    if (r && r.ok) {
                        pendRef.current = {}; inVoloRef.current = {}; toccateRef.current = {}; buttaLocale(se.pin);
                        if (r.vista) mettiVista(r.vista); else ricaricaVista();
                        return true;
                    }
                } catch (e) { }
                return false;
            };

            const riprova = async () => {
                const se = sessRef.current; if (!se) return false;
                try {
                    const r = await portaPaziente('ver_riprova', { p_pin: se.pin, p_dispositivo: codiceDispositivo() }, 3);
                    if (r && r.ok) { pendRef.current = {}; inVoloRef.current = {}; toccateRef.current = {}; buttaLocale(se.pin); salvaSessione(se.pin, r.sessione); mettiVista(r.vista); return true; }
                } catch (e) { }
                return false;
            };

            const entra = (pin, r) => {
                // Ingresso col PIN = gettone NUOVO: una copia locale rimasta da una sessione di prima non vale piu'.
                pendRef.current = {}; inVoloRef.current = {}; toccateRef.current = {}; buttaLocale(pin); rifiutiRef.current = 0; salutatoRef.current = false;
                salvaSessione(pin, r.sessione);
                mettiVista(r.vista);
                setBussa(null); setView('student');
            };

            const handleStudentLogin = async (pin, callback) => {
                let r = null;
                try { r = await portaPaziente('ver_entra', { p_pin: pin, p_dispositivo: codiceDispositivo() }, 3); }
                catch (e) { callback({ ok: false, msg: "Il collegamento non risponde: il tuo PIN non c'entra. Riprova fra un momento." }); return; }
                if (!r || !r.trovato) { callback({ ok: false, msg: "PIN non censito a sistema." }); return; }
                if (r.vuota) { callback({ ok: false, msg: "Nessuna prova attiva per la tua classe." }); return; }
                if (!r.allow) { setBussa({ pin, nome: r.nome || '' }); setView('bloccato'); callback({ ok: true }); return; }
                entra(pin, r);
                callback({ ok: true });
            };

            // Chi e' fermo su «Accesso bloccato» ribussa da solo ogni 5 secondi: appena il docente preme «Sblocca» entra,
            // e se chi lavorava non e' piu' collegato e' questa bussata che fa comparire lo «Sblocca» nel cruscotto.
            useEffect(() => {
                if (view !== 'bloccato' || !bussa) return;
                let vivo = true;
                let bussataInVolo = false;   // rete lenta: se la bussata di prima non e' tornata, questo giro si salta.
                                             // Due bussate insieme dopo lo «Sblocca» davano DUE gettoni: la pagina teneva il
                                             // primo, il cloud il secondo, e dopo dieci secondi compariva «Sessione chiusa».
                const t = setInterval(async () => {
                    if (bussataInVolo) return;
                    bussataInVolo = true;
                    try {
                        const r = await porta('ver_entra', { p_pin: bussa.pin, p_dispositivo: codiceDispositivo() });
                        if (!vivo || !r) return;
                        if (!r.trovato) { tornaIngresso(); return; }
                        if (r.allow) entra(bussa.pin, r);
                    } catch (e) { }
                    finally { bussataInVolo = false; }
                }, 5000);
                return () => { vivo = false; clearInterval(t); };
            }, [view, bussa && bussa.pin]);

            /* BATTITO + PALLINO ROSSO. Ogni 5 secondi, e subito a ogni cambio (scheda cambiata, finestra abbassata,
               altra app, schermo spento, clic fuori dalla finestra): dice al cloud «sono qui» e se la pagina e' davanti
               o no. Quando la pagina si chiude davvero saluta (ver_esci): il docente vede «Non collegato» all'istante.
               Un'app uccisa dal telefono non puo' salutare: li' si aspetta che scadano i 20 secondi. */
            useEffect(() => {
                if (view !== 'student') return;
                salutatoRef.current = false; rifiutiRef.current = 0;
                /* (22/09/2026) PALLINO FALSO: Bosio in 3G e Castellengo in 4F erano sulla pagina, eppure il pallino e'
                   rimasto acceso 54 e 86 secondi. Su Android la tendina di una domanda di abbinamento (e la tastiera di
                   una casella) e' una finestrella a parte: la pagina PERDE IL FUOCO (blur, hasFocus() falso) pur restando
                   in vista, e ogni battito ripeteva «fuori» finche' l'alunno non toccava altro. Regola: se la pagina e'
                   IN VISTA e il fuoco sta su una tendina o una casella della prova, l'alunno e' qui. «Fuori» resta vero
                   quando la pagina e' nascosta (altra app, schermo spento, scheda cambiata) o quando il fuoco se n'e'
                   andato senza un campo attivo (un'altra finestra sul computer). */
                /* 22/09/2026 sera: la regola vale SOLO sui dispositivi a tocco (come in Cedolino e Fattura Facile). Al computer
                   le tendine non tolgono il fuoco, e senza questo limite chi aveva appena cliccato una risposta poteva passare a
                   un'altra finestra senza accendere il pallino (il campo cliccato resta «attivo» anche a finestra lasciata). */
                const suUnCampo = () => {
                    try { if (!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) return false; } catch (e) { return false; }
                    const a = document.activeElement; return !!(a && /^(SELECT|INPUT|TEXTAREA)$/.test(a.tagName));
                };
                /* FINESTRA RIMPICCIOLITA (22/09/2026, come in Cedolino Facile). Un alunno teneva la prova davanti, col
                   fuoco, in una finestra piccola, e di fianco un altro browser da cui leggere: guardare un'altra finestra
                   non toglie il fuoco, quindi niente pallino. La pagina non vede le altre finestre, ma sa quanto e' grande
                   la sua rispetto allo schermo del dispositivo (gia' senza la barra delle applicazioni): sotto il 90% della
                   larghezza o l'85% dell'altezza e' «fuori» (finestra non ingrandita, schermo diviso, finestra mobile del
                   telefono). Sui telefoni l'altezza non conta mentre si scrive in una casella: la tastiera la accorcia. */
                const finestraRistretta = () => {
                    try {
                        let sw = screen.availWidth || screen.width, sh = screen.availHeight || screen.height;
                        const fw = window.outerWidth || window.innerWidth, fh = window.outerHeight || window.innerHeight;
                        if (!sw || !sh || !fw || !fh) return false;
                        // iPhone e iPad danno lo schermo sempre in verticale: lo giro se la finestra e' in orizzontale
                        if ((window.innerWidth > window.innerHeight) !== (sw > sh)) { const t = sw; sw = sh; sh = t; }
                        if (fw < sw * 0.90) return true;
                        let tocco = false;
                        try { tocco = window.matchMedia && window.matchMedia('(pointer: coarse)').matches; } catch (e) { }
                        const a = document.activeElement;
                        const scrive = !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable));
                        if (tocco && scrive) return false;
                        return fh < sh * 0.85;
                    } catch (e) { return false; }
                };
                const fuoriAdesso = () => document.visibilityState === 'hidden' || (!document.hasFocus() && !suUnCampo()) || finestraRistretta();
                // Un dispositivo che manda la pagina dietro puo' congelarla o ucciderla senza preavviso: cio' che non e'
                // ancora confermato parte subito con l'invio che il browser spedisce comunque (keepalive).
                const salvaResto = () => {
                    if (!sessRef.current || salutatoRef.current) return;
                    const resto = { ...inVoloRef.current, ...pendRef.current };
                    try { if (Object.keys(resto).length) porta('ver_rispondi', { ...chiaviSessione(), p_risposte: resto }, true).catch(() => {}); } catch (e) { }
                };
                const stato = () => { if (document.visibilityState === 'hidden') salvaResto(); batti(fuoriAdesso(), true); };
                const via = () => { if (document.visibilityState !== 'hidden' && suUnCampo()) return; batti(true, true); };
                const riapre = () => { salutatoRef.current = false; stato(); };
                const chiude = (e) => {
                    if (e && e.persisted) { via(); return; }        // pagina solo messa da parte: vale come uscita
                    if (salutatoRef.current || !sessRef.current) return;
                    const resto = { ...inVoloRef.current, ...pendRef.current };
                    try {
                        if (Object.keys(resto).length) porta('ver_rispondi', { ...chiaviSessione(), p_risposte: resto }, true).catch(() => {});
                        porta('ver_esci', chiaviSessione(), true).catch(() => {});
                    } catch (err) { }
                    salutatoRef.current = true;                     // dopo il saluto il browser manda ancora un «nascosta»: non deve sorpassarlo
                };
                stato();
                document.addEventListener('visibilitychange', stato);
                window.addEventListener('blur', via);
                window.addEventListener('focus', stato);
                window.addEventListener('pageshow', riapre);
                window.addEventListener('pagehide', chiude);
                document.addEventListener('freeze', via);
                document.addEventListener('resume', stato);
                const t = setInterval(() => batti(fuoriAdesso(), false), 5000);
                // Finestra rimpicciolita o ingrandita, schermo diviso aperto o chiuso: lo dico subito (a trascinamento finito).
                let ridimTimer = null, ultimoRistretta = finestraRistretta();
                const ridimensiona = () => {
                    if (ridimTimer) clearTimeout(ridimTimer);
                    ridimTimer = setTimeout(() => {
                        ridimTimer = null;
                        const r = finestraRistretta();
                        if (r === ultimoRistretta) return;
                        ultimoRistretta = r;
                        batti(fuoriAdesso(), true);
                    }, 400);
                };
                window.addEventListener('resize', ridimensiona);
                return () => {
                    clearInterval(t);
                    if (ridimTimer) clearTimeout(ridimTimer);
                    window.removeEventListener('resize', ridimensiona);
                    document.removeEventListener('visibilitychange', stato);
                    window.removeEventListener('blur', via);
                    window.removeEventListener('focus', stato);
                    window.removeEventListener('pageshow', riapre);
                    window.removeEventListener('pagehide', chiude);
                    document.removeEventListener('freeze', via);
                    document.removeEventListener('resume', stato);
                };
            }, [view]);

            // F5 o scheda ripristinata: la sessione sta in sessionStorage, il gettone e' ancora buono.
            useEffect(() => {
                let eraDocente = null;
                try { eraDocente = sessionStorage.getItem(DOCENTE_KEY); } catch (e) { }
                if (eraDocente) {
                    // DOCENTE: dopo un F5 resta nel cruscotto, ma solo se il cloud lo riconosce ancora.
                    (async () => {
                        try {
                            const { data } = await supabase.auth.getSession();
                            if (data && data.session) {
                                const r = await supabase.rpc('cf_e_docente');
                                if (r.data === true) { setView('admin'); setLoading(false); return; }
                            }
                        } catch (e) { }
                        try { sessionStorage.removeItem(DOCENTE_KEY); } catch (e) { }
                        setLoading(false);
                    })();
                    return;
                }
                let raw = null;
                try { raw = sessionStorage.getItem(SESSION_KEY); } catch (e) { }
                if (!raw) { setLoading(false); return; }
                (async () => {
                    try {
                        const salvata = JSON.parse(raw);
                        // (20/09/2026) NON SI ARRENDE: prima dopo tre tentativi l'alunno si ritrovava alla schermata del PIN
                        // senza una parola, pur avendo il gettone ancora buono. Ora insiste finche' il cloud risponde; dopo
                        // il secondo tentativo a vuoto lo dice, e lascia comunque la strada del PIN.
                        let r = null, giri = 0;
                        while (!annullaRipristinoRef.current) {
                            try { r = await porta('ver_mio', { p_pin: String(salvata.pin), p_sess: salvata.sess || null, p_dispositivo: codiceDispositivo() }); break; }
                            catch (e) { giri++; if (giri >= 2) setReteDebole(true); await new Promise(ok => setTimeout(ok, Math.min(1500 + giri * 1000, 6000))); }
                        }
                        if (annullaRipristinoRef.current) { setLoading(false); return; }
                        if (r && r.ok && r.vista && r.vista.student.status !== 'idle') {
                            sessRef.current = { pin: String(salvata.pin), sess: salvata.sess || null };
                            // le risposte che non avevano fatto in tempo ad arrivare al cloud (stesso gettone): di nuovo in coda
                            if (r.vista.student.status === 'playing') {
                                const rimaste = leggiLocale(String(salvata.pin), salvata.sess || null);
                                if (Object.keys(rimaste).length) { pendRef.current = { ...rimaste }; toccateRef.current = { ...rimaste }; }
                            }
                            mettiVista(r.vista); setView('student');
                            if (Object.keys(pendRef.current).length) spedisciRisposte();
                        } else dimenticaSessione();
                    } catch (e) { }
                    setReteDebole(false);
                    setLoading(false);
                })();
            }, []);

            if (loading) {
                return (
                    <div className="flex-grow flex items-center justify-center bg-[#eef0ea]">
                        <div className="text-center font-bold text-[#57534a] text-lg">
                            {reteDebole ? 'Il collegamento è debole: sto riaprendo la tua prova…' : 'Connessione al Cloud Engine in corso...'}
                            {reteDebole && (
                                <div className="mt-4 text-sm font-normal">
                                    Le risposte che hai scritto sono al sicuro.
                                    <div className="mt-3"><button className="underline" onClick={() => { annullaRipristinoRef.current = true; setLoading(false); }}>Entra col PIN</button></div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            if (view === 'admin') return <AdminApp db={db} onSyncUpdate={syncUpdateCloud} onResetDB={resetDatabaseCloud} onExit={async () => { try { sessionStorage.removeItem(DOCENTE_KEY); } catch (e) { } try { await supabase.auth.signOut({ scope: 'local' }); } catch (e) { } setView('landing'); }} />;
            if (view === 'student' && vista) return <StudentApp vista={vista} azioni={{ rispondi, consegna, riprova }} />;
            if (view === 'bloccato' && bussa) return <SchermoBloccato nome={bussa.nome} />;
            if (view === 'chiusa') return <SessioneChiusa onTorna={() => setView('landing')} />;
            return <Landing onStudent={handleStudentLogin} onAdmin={() => { try { sessionStorage.setItem(DOCENTE_KEY, '1'); } catch (e) { } setView('admin'); }} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <!--
      MODIFICHE APPLICATE (prof. Becattini · dashboard verifiche):
      1) ReviewExam: badge "ottenuti / massimo" per ogni domanda chiusa quando reveal=true
         (verde=pieno, rosso=zero, grigio=parziale). Le aperte mantengono il badge X/Y pt esistente.
      2) Modalità ESERCITAZIONE per classe (flag classData.esercitazione, default false):
         - AdminApp: toggle Verifica/Esercitazione nell'header + default flag su handleUploadClasse
           e nel ripristino backup (single/full) + campo nel backup esportato.
         - StudentApp: const esercitazione; consegna() -> status 'published' se esercitazione;
           funzione riprova() (azzera studente e rigenera optionOrder/matchOrder/questionOrder);
           pulsante "Riprova · Nuova esercitazione" nella vista 'published'.
         - App.handleStudentLogin: ramo 'playing' non blocca mai se esercitazione (rientro libero).
      3) CONSEGNA FORZATA (AdminApp):
         - consegnaForzata(pin): chiude un singolo studente 'playing' (published in esercitazione,
           submitted in verifica) con closedScore; pulsante "Consegna" per riga sugli studenti in corso.
         - consegnaForzataClasse(): chiude tutti gli studenti 'playing'; pulsante "Consegna classe"
           + modale di conferma (forceAllOpen).
      4) BARRA AZIONI SU UNA RIGA + ETICHETTE CORTE (AdminApp):
         - contenitore flex con md:flex-nowrap, gap-1.5 e px-3 (whitespace-nowrap sui bottoni) cosi
           su desktop/smartboard i pulsanti stanno in fila; flex-wrap resta come fallback su schermi stretti.
         - etichette accorciate: "Consegna classe (N)", "Esporta HTML", "Backup", "Ripristina", "Reset".
      5) ANNULLA / RIPRENDI CONSEGNA (AdminApp):
         - consegnaForzata()/consegnaForzataClasse() marcano gli studenti chiusi con forced:true;
           consegna() volontaria e riprova() impostano forced:false.
         - riprendi(pin): rimette status:'playing', resumeAllowed:true, submittedAt:null, closedScore:null,
           graded:false e rimuove forced, SENZA toccare answers/openAnswer/optionOrder/matchOrder/questionOrder.
           Pulsante "Riprendi" per riga sugli studenti 'submitted'/'published' (distinto da "Riapri").
         - annullaConsegnaClasse(): applica riprendi a tutti gli studenti con forced:true; pulsante
           "Annulla consegna classe (N)" (visibile solo se forcedCount>0) + modale di conferma (undoAllOpen).
      Nessuna modifica a Supabase/schema/costanti; ogni scrittura passa da onSyncUpdate/syncUpdateCloud.
    -->
</body>
</html>
